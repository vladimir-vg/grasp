# Grasp: a compiler frontend and the runtime that executes what it emits.
#
# The language the two agree on is specified in `docs/grasp-dbsp/language.md`,
# which is why the design documents live at the workspace root rather than
# inside either crate.
[workspace]
# Edition 2024 implies resolver 3 for a package, but a virtual manifest has to
# say so itself.
resolver = "3"
members = ["crates/*"]
# The Feldera crates are path dependencies *inside* this directory, through the
# `vendor` symlink, so an explicit workspace would otherwise claim them as
# members — and they inherit `rust-version` from their own workspace root, which
# is not this one.
exclude = ["vendor"]

# Shared so the two crates cannot drift apart on a version, and so the Feldera
# path dependencies stay relative to this file rather than to each member.
[workspace.dependencies]
# Feldera crates, resolved through `vendor/feldera` — a gitignored symlink to a
# local checkout of https://github.com/feldera/feldera. See README.md.
#
# These are path dependencies rather than git or crates.io dependencies because
# the runner is developed against a Feldera working tree, and because a git
# dependency cannot be resolved offline even when `[patch]` redirects it to a
# local path. Do not write a machine-specific absolute path here: it makes the
# workspace unbuildable for anyone else.
dbsp = { path = "vendor/feldera/crates/dbsp" }
# `FlatVariant`, the byte-encoded document behind the `json` type. Chosen for
# its invariants rather than convenience: see docs/grasp-dbsp/mapping.md.
feldera-sqllib = { path = "vendor/feldera/crates/sqllib" }
# Provides the `IsNone` derive, which also supplies `SupportsRoaring` — both are
# required for `DynValue` to satisfy `DBData`.
feldera-macros = { path = "vendor/feldera/crates/feldera-macros" }

# These must match the versions `dbsp` builds against, or the derived trait
# impls will not unify with the ones its bounds require. Note that `size-of` is
# a renamed fork (`feldera-size-of`) — the crates.io `size-of` crate defines a
# different `SizeOf` trait and will not satisfy `DBData`.
# `default-features = false` is required, not stylistic: the default feature set
# includes `size_32`, `dbsp` enables `size_64`, and rkyv rejects both at once.
# This matches how the Feldera workspace declares it.
rkyv = { version = "0.7.45", default-features = false }
# The wire form of `bytes`. Not a trait-implementing crate, so the version need
# not match `dbsp`'s the way the ones above must; it matches the Feldera
# workspace's pin because there is no reason to differ.
base64 = "0.22.1"
size-of = { version = "0.1.7", features = ["time-std", "ordered-float"], package = "feldera-size-of" }
# The hash behind a node's content id, which is a `persistent_id` and so must
# be stable across builds and processes — the same requirement, and the same
# algorithm, as `dbsp`'s own `default_hash` (`dbsp/src/hash.rs`). Rust's
# `DefaultHasher` is explicitly not guaranteed stable across releases.
xxhash-rust = { version = "0.8.6", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `Runtime::init_circuit`'s constructor closure returns `anyhow::Result`.
anyhow = "1"

proptest = "1"
# Per-case test names for the YAML fixtures, which `libtest` cannot express.
libtest-mimic = "0.8"
# Matches the version the Feldera workspace pins. Formally deprecated, but
# 0.9.34 is its final stable release and is what this ecosystem uses.
serde_yaml = "0.9.34"
# A spill directory per test. `dbsp` locks the directory a circuit spills into
# and refuses a second circuit in the same one, so the tests cannot share a
# fixed path — and `dbsp::storage::backend::tempdir_for_thread` is per *thread*,
# which two live runners in one test would collide on. Already in the lock file
# through `dbsp`, so this costs no new compilation.
tempfile = "3"
# Only to name a checkpoint in a test: `CircuitStorageConfig::init_checkpoint`
# is an `Option<Uuid>`, and the runner refuses any configuration that sets it.
# Already in the lock file through `dbsp`.
uuid = "1"

# --- The server ---------------------------------------------------------------
# These belong to `grasp-dbsp-server` alone. They are declared here because
# every dependency in this workspace is, and they are kept out of
# `grasp-dbsp` deliberately: `grasp-compiler` dev-depends on that crate, and
# its own manifest argues that the dependency "must stay one … a normal
# dependency would put `dbsp`, `rkyv` and `feldera-sqllib` into the graph of a
# crate that only manipulates strings". An HTTP stack in `grasp-dbsp` would land
# in that same graph.

# The HTTP surface. actix-web because this server is a drop-in for Feldera's,
# and Feldera's is an actix application (`adapters/src/server.rs`) — so a
# handler here can be read against the handler it copies. It is also already in
# the lock file as a transitive dependency of `dbsp` (through `feldera-types`),
# so the choice costs linking rather than compilation.
actix-web = "4.15.0"
# Only `sync` and `time`: a `oneshot` for a handler awaiting the circuit
# thread's reply, an `mpsc` per egress connection, a `watch` for the run state a
# paused ingress request waits on. The runtime itself comes from actix-rt.
tokio = { version = "1.53.1", default-features = false, features = ["sync", "time"] }
# The command channel *into* the circuit thread, which is a plain OS thread with
# no runtime in scope and so cannot `await`. Sending on an unbounded crossbeam
# channel never blocks, which is what makes it callable from an async handler;
# `tokio::sync::mpsc` is the right type for the other direction and the wrong
# one for this. Already in the lock file through `dbsp`, which uses it to talk
# to its own workers.
crossbeam-channel = "0.5.16"
# The command-line surface: `validate` and `serve`, the two commands
# `docs/grasp-dbsp/overview.md` has named as placeholders since the beginning.
# Already in the lock file through `dbsp` and `feldera-types`.
clap = { version = "4.6.6", features = ["derive"] }
# The egress response body. `stream!` is the macro Feldera's own HTTP output
# transport builds its chunked response with (`adapters/src/transport/http/
# output.rs:238`), and the alternative — a hand-written `Stream` impl over the
# same state machine — is strictly more code for the same behaviour. Already in
# the lock file through `dbsp`.
async-stream = "0.3.6"
