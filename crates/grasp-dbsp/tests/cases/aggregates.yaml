# aggregate with min and max. Note `aggregate` takes a projection function:
# `Stream::aggregate` folds over the value, so the value is re-projected first.

- name: max salary per department
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    by_dept := aggregate(idx, max, function((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 100}]
        - [1, {id: 2, dept_id: 10, salary: 200}]
        - [1, {id: 3, dept_id: 20, salary: 70}]

  expected_exact_output:
    - by_dept:
        - [1, 10, 200]
        - [1, 20, 70]

- name: min over the same grouping
  source: |
    emp := input("emp")
    emp :: zset(record(dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    lowest := aggregate(idx, min, function((v) -> v.salary))

  input:
    - emp:
        - [1, {dept_id: 10, salary: 100}]
        - [1, {dept_id: 10, salary: 200}]

  expected_exact_output:
    - lowest:
        - [1, 10, 100]

- name: retracting the maximum moves the aggregate down
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    by_dept := aggregate(idx, max, function((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 150}]
        - [1, {id: 2, dept_id: 10, salary: 90}]
    - emp:
        - [-1, {id: 1, dept_id: 10, salary: 150}]

  expected_exact_output:
    - by_dept:
        - [1, 10, 150]
    - by_dept:
        - [-1, 10, 150]
        - [1, 10, 90]

- name: removing the last row of a group retracts the group
  source: |
    emp := input("emp")
    emp :: zset(record(dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    by_dept := aggregate(idx, max, function((v) -> v.salary))

  input:
    - emp:
        - [1, {dept_id: 10, salary: 100}]
    - emp:
        - [-1, {dept_id: 10, salary: 100}]

  expected_exact_output:
    - by_dept:
        - [1, 10, 100]
    - by_dept:
        - [-1, 10, 100]

- name: sum over integers
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    total := aggregate(idx, sum, function((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 100}]
        - [1, {id: 2, dept_id: 10, salary: 200}]
        - [1, {id: 3, dept_id: 20, salary: 70}]

  expected_exact_output:
    - total:
        - [1, 10, 300]
        - [1, 20, 70]

- name: sum is maintained incrementally under a retraction
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    total := aggregate(idx, sum, function((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 100}]
        - [1, {id: 2, dept_id: 10, salary: 200}]
    - emp:
        - [-1, {id: 2, dept_id: 10, salary: 200}]

  expected_exact_output:
    - total:
        - [1, 10, 300]
    - total:
        - [-1, 10, 300]
        - [1, 10, 100]

- name: a row of weight two counts twice toward the sum
  source: |
    emp := input("emp")
    emp :: zset(record(dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    total := aggregate(idx, sum, function((v) -> v.salary))

  input:
    - emp:
        - [2, {dept_id: 10, salary: 100}]

  expected_exact_output:
    - total:
        - [1, 10, 200]

# `avg` gives back the projection's type, as every aggregator but `count` does.
# The mean of `i64`s is an `i64`, and integer division truncates **toward zero**
# — so a negative group rounds up rather than down, which is the direction this
# case exists to pin.
- name: avg over integers truncates toward zero
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    mean := aggregate(idx, avg, function((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 100}]
        - [1, {id: 2, dept_id: 10, salary: 101}]
        - [1, {id: 3, dept_id: 20, salary: -1}]
        - [1, {id: 4, dept_id: 20, salary: -2}]

  # 201 / 2 is 100, and -3 / 2 is -1 rather than -2.
  expected_exact_output:
    - mean:
        - [1, 10, 100]
        - [1, 20, -1]

# The wrapper follows the projection, and absence is skipped rather than folded
# — so the mean is over the values that are there.
- name: avg over an optional projection skips what is absent
  source: |
    t := input("t")
    t :: zset(record(g: string, n: optional(i64)))
    idx := map_index(t, function((r) -> record(key: r.g, value: record(n: r.n))))
    mean := aggregate(idx, avg, function((v) -> v.n))

  input:
    - t:
        - [1, {g: "some", n: 10}]
        - [1, {g: "some", n: null}]
        - [1, {g: "some", n: 20}]
        - [1, {g: "none", n: null}]
        - [1, {g: "none", n: null}]

  # 30 / 2, not 30 / 3 — and a group with nothing to average still reports.
  expected_exact_output:
    - mean:
        - [1, "some", 15]
        - [1, "none", null]

- name: count ignores rows whose projection is null
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, bonus: optional(i64)))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    with_bonus := aggregate(idx, count, function((v) -> v.bonus))
    depts := map(emp, function((r) -> r.dept_id))
    everyone := weighted_count(depts)

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, bonus: 50}]
        - [1, {id: 2, dept_id: 10, bonus: null}]

  # This is the whole difference between the two: `count` sees the projection,
  # `weighted_count` sees the rows.
  expected_exact_output:
    - with_bonus:
        - [1, 10, 1]
      everyone:
        - [1, 10, 2]

- name: summing an all-null group yields null
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, bonus: optional(i64)))
    idx := map_index(emp, function((r) -> record(key: r.dept_id, value: r)))
    total := aggregate(idx, sum, function((v) -> v.bonus))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, bonus: null}]

  # No row contributed, so there is no sum to report -- which is exactly what
  # the row counter in the accumulator exists to detect.
  expected_exact_output:
    - total:
        - [1, 10, null]

- name: min and max over floats still work
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: f64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    lo := aggregate(idx, min, function((v) -> v.x))
    hi := aggregate(idx, max, function((v) -> v.x))

  # The exclusion is scoped to the linear path; min and max compare rather than
  # accumulate, so associativity does not arise.
  input:
    - a:
        - [1, {k: 1, x: 2.5}]
        - [1, {k: 1, x: -1.5}]

  expected_exact_output:
    - lo:
        - [1, 1, -1.5]
      hi:
        - [1, 1, 2.5]

- name: sum over a definite projection never reports absence
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: i64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    out := aggregate(idx, sum, function((r) -> r.v))

  # The two rows cancel in the row counter but not in the sum, so the group is
  # reported with `rows == 0`. With a projection that cannot be NONE the
  # weighted sum is still the answer — returning NONE here would contradict the
  # node's type, which is `indexed_zset(i64, i64)`.
  input:
    - a:
        - [1, {k: 1, v: 5}]
        - [-1, {k: 1, v: 3}]

  expected_exact_output:
    - out:
        - [1, 1, 2]

# The same shape for `avg`, which once returned absence unconditionally at
# `rows == 0`: with a definite projection the rows counter and the presence
# counter cancel together, the accumulator is zero, and `dbsp` reports no
# group at all — never `NONE` in a column typed `i64`.
- name: avg over a definite projection retracts the group rather than reporting absence
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: i64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    out := aggregate(idx, avg, function((r) -> r.v))

  input:
    - a:
        - [1, {k: 1, v: 5}]
    - a:
        - [-1, {k: 1, v: 5}]

  expected_exact_output:
    - out:
        - [1, 1, 5]
    - out:
        - [-1, 1, 5]

# --- min and max over a projection that may be absent ------------------------
#
# `NONE` is `DynValue` variant 0, so it sorts before every value. dbsp's `Min`
# walks the cursor forward and `Max` walks it backward, which makes them
# disagree about absence unless `min` is given help. Feldera hand-wrote
# `MinSome1` for exactly this and needed no `MaxSome`.

- name: min and max ignore absent projections
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: optional(i64)))
    idx  := map_index(a, function((r) -> record(key: r.k, value: r)))
    lo   := aggregate(idx, min, function((r) -> r.v))
    hi   := aggregate(idx, max, function((r) -> r.v))

  input:
    - a:
        - [1, {k: 1, v: 5}]
        - [1, {k: 1, v: null}]
        - [1, {k: 1, v: 3}]

  expected_exact_output:
    - lo:
        - [1, 1, 3]
      hi:
        - [1, 1, 5]

- name: a group whose projections are all absent still reports
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: optional(i64)))
    idx  := map_index(a, function((r) -> record(key: r.k, value: r)))
    lo   := aggregate(idx, min, function((r) -> r.v))
    hi   := aggregate(idx, max, function((r) -> r.v))

  # The group exists and has no value, so it is emitted with `NONE` rather than
  # disappearing — the same rule the linear aggregates needed a second counter
  # for, and what `MinSome1` returns for this case.
  input:
    - a:
        - [1, {k: 1, v: null}]
        - [1, {k: 1, v: null}]

  expected_exact_output:
    - lo:
        - [1, 1, null]
      hi:
        - [1, 1, null]

# --- floating-point sum and avg ----------------------------------------------
#
# Floats do not take the linear path — fp addition is not associative, so an
# incrementally maintained sum would depend on the order changes arrived in.
# They take a fold that replays the group in cursor order, which is
# deterministic. Feldera splits them the same way. Which path runs is invisible
# from the source, so the two must agree about absence and about weights.

- name: sum and avg over floats
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: f64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    total := aggregate(idx, sum, function((r) -> r.x))
    mean  := aggregate(idx, avg, function((r) -> r.x))

  input:
    - a:
        - [1, {k: 1, x: 1.5}]
        - [1, {k: 1, x: 2.5}]
        - [2, {k: 1, x: 3.0}]

  # The weight-two row contributes twice, as it does on the linear path.
  expected_exact_output:
    - total:
        - [1, 1, 10.0]
      mean:
        - [1, 1, 2.5]

- name: a float sum agrees with the integer one about absence
  source: |
    a := input("a")
    a :: zset(record(k: i64, f: optional(f64), n: optional(i64)))
    idx    := map_index(a, function((r) -> record(key: r.k, value: r)))
    floats := aggregate(idx, sum, function((r) -> r.f))
    ints   := aggregate(idx, sum, function((r) -> r.n))

  # Key 1 has one contributing row; key 2 has none. Both paths must report the
  # sum for the first and `NONE` for the second, rather than dropping it.
  input:
    - a:
        - [1, {k: 1, f: 1.5, n: 3}]
        - [1, {k: 1, f: null, n: null}]
        - [1, {k: 2, f: null, n: null}]

  expected_exact_output:
    - floats:
        - [1, 1, 1.5]
        - [1, 2, null]
      ints:
        - [1, 1, 3]
        - [1, 2, null]

# An aggregate over the whole relation, with nothing to group by. The group is
# the empty key, so the index is `record()` — the same unit key a cross product
# uses. This is what a frontend emits for a head whose only column is the
# aggregate.
- name: an aggregate with no group columns indexes on the unit key
  source: |
    emp :: zset(record(dept: string, sal: i64))
    emp := input("emp")
    g := map_index(emp, function((r) -> record(key: record(), value: r)))
    total := aggregate(g, sum, function((v) -> v.sal))

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
        - [1, {dept: "ops", sal: 50}]
    - emp:
        - [1, {dept: "eng", sal: 25}]

  expected_exact_output:
    - total:
        - [1, {}, 150]
    - total:
        - [-1, {}, 150]
        - [1, {}, 175]

# `count` counts the projections that are there, whatever their type. Reading
# "not a number" as "absent" made it return zero for every group — the linear
# accumulator carries an i64, so a `string` fell into the same arm as `NONE`.
- name: count counts a non-numeric projection
  source: |
    t := input("t")
    t :: zset(record(g: string, name: string))
    idx := map_index(t, function((r) -> record(key: r.g, value: record(name: r.name))))
    n   := aggregate(idx, count, function((v) -> v.name))

  input:
    - t:
        - [1, {g: "a", name: "ann"}]
        - [1, {g: "a", name: "bo"}]
        - [1, {g: "b", name: "cy"}]

  expected_exact_output:
    - n:
        - [1, "a", 2]
        - [1, "b", 1]

- name: count skips an absent projection but keeps the group
  source: |
    t := input("t")
    t :: zset(record(g: string, name: optional(string)))
    idx := map_index(t, function((r) -> record(key: r.g, value: record(name: r.name))))
    n   := aggregate(idx, count, function((v) -> v.name))

  input:
    - t:
        - [1, {g: "a", name: "ann"}]
        - [1, {g: "a", name: null}]
        - [1, {g: "b", name: null}]

  expected_exact_output:
    - n:
        - [1, "a", 1]
        - [1, "b", 0]
