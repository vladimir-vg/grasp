# join and antijoin over indexed streams.

- name: join two tables on a shared key
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, name: string, dept_id: i64))
    dept := input("dept")
    dept :: zset(record(id: i64, dname: string))

    emp_idx  := map_index(emp,  function((r) -> record(key: r.dept_id, value: record(name: r.name))))
    dept_idx := map_index(dept, function((r) -> record(key: r.id, value: record(dname: r.dname))))
    joined   := join(emp_idx, dept_idx, function((k, e, d) -> record(name: e.name, dname: d.dname)))

  input:
    - emp:
        - [1, {id: 1, name: "ada", dept_id: 10}]
        - [1, {id: 2, name: "bob", dept_id: 10}]
        - [1, {id: 3, name: "cy", dept_id: 20}]
      dept:
        - [1, {id: 10, dname: "eng"}]
        - [1, {id: 20, dname: "ops"}]

  expected_exact_output:
    - joined:
        - [1, {name: "ada", dname: "eng"}]
        - [1, {name: "bob", dname: "eng"}]
        - [1, {name: "cy", dname: "ops"}]

- name: a row with no match on the other side produces nothing
  source: |
    l := input("l")
    l :: zset(record(k: i64, a: i64))
    r := input("r")
    r :: zset(record(k: i64, b: i64))
    li := map_index(l, function((x) -> record(key: x.k, value: record(a: x.a))))
    ri := map_index(r, function((x) -> record(key: x.k, value: record(b: x.b))))
    j  := join(li, ri, function((k, x, y) -> record(k: k, a: x.a, b: y.b)))

  input:
    - l:
        - [1, {k: 1, a: 100}]
        - [1, {k: 2, a: 200}]
      r:
        - [1, {k: 1, b: 900}]

  expected_exact_output:
    - j:
        - [1, {k: 1, a: 100, b: 900}]

- name: the right side arriving later still joins
  source: |
    l := input("l")
    l :: zset(record(k: i64, a: i64))
    r := input("r")
    r :: zset(record(k: i64, b: i64))
    li := map_index(l, function((x) -> record(key: x.k, value: record(a: x.a))))
    ri := map_index(r, function((x) -> record(key: x.k, value: record(b: x.b))))
    j  := join(li, ri, function((k, x, y) -> record(a: x.a, b: y.b)))

  input:
    - l:
        - [1, {k: 1, a: 100}]
    - r:
        - [1, {k: 1, b: 900}]

  expected_exact_output:
    - j: []
    - j:
        - [1, {a: 100, b: 900}]

- name: antijoin keeps only unmatched keys
  source: |
    pos := input("pos")
    pos :: zset(record(k: i64, a: i64))
    excluded := input("excluded")
    excluded :: zset(record(k: i64))
    pi := map_index(pos, function((x) -> record(key: x.k, value: record(a: x.a))))
    ni := map_index(excluded, function((x) -> record(key: x.k, value: record(k: x.k))))
    out := antijoin(pi, ni)

  input:
    - pos:
        - [1, {k: 1, a: 100}]
        - [1, {k: 2, a: 200}]
      excluded:
        - [1, {k: 1}]

  expected_exact_output:
    - out:
        - [1, 2, {a: 200}]

- name: join_index keeps the result indexed for a second join
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64))
    dept := input("dept")
    dept :: zset(record(id: i64, region_id: i64))
    region := input("region")
    region :: zset(record(id: i64, rname: string))

    ei := map_index(emp,  function((r) -> record(key: r.dept_id, value: record(id: r.id))))
    di := map_index(dept, function((r) -> record(key: r.id, value: record(region_id: r.region_id))))
    # Re-key onto region_id without a separate map_index step.
    by_region := join_index(ei, di, function((k, e, d) -> record(key: d.region_id, value: record(id: e.id))))

    ri := map_index(region, function((r) -> record(key: r.id, value: record(rname: r.rname))))
    out := join(by_region, ri, function((k, e, r) -> record(id: e.id, rname: r.rname)))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10}]
      dept:
        - [1, {id: 10, region_id: 100}]
      region:
        - [1, {id: 100, rname: "emea"}]

  expected_exact_output:
    - out:
        - [1, {id: 1, rname: "emea"}]

- name: key and value are matched by name, not position
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: i64))
    forward  := map_index(a, function((r) -> record(key: r.k, value: r)))
    reversed := map_index(a, function((r) -> record(value: r, key: r.k)))

  # `key` and `value` are the one place a field *name* carries meaning, so the
  # order they are written in does not matter — unlike every other record,
  # where the literal's order defines the type.
  input:
    - a:
        - [1, {k: 7, v: 1}]

  expected_exact_output:
    - forward:
        - [1, 7, {k: 7, v: 1}]
      reversed:
        - [1, 7, {k: 7, v: 1}]

# --- Outer joins ------------------------------------------------------------
#
# There is no `left_join` operator. `dbsp` has one, but its right-hand input is
# `OrdIndexedZSet<K, Option<V2>>` — a second Rust batch type, in a design whose
# leverage is that there is exactly one. It does not need one: a left join is
# `join ∪ (antijoin × null)`, which is three operators that already exist.
#
# What was missing was a way out of an indexed stream. `antijoin` produces one,
# and until `map` accepted either shape its rows could be observed but never
# transformed, so this query could not be written at all.

- name: a left join, written the way a frontend would emit it
  source: |
    emp := input("emp")
    emp :: zset(record(name: string, dept_id: i64))

    dept := input("dept")
    dept :: zset(record(id: i64, dname: string))

    emp_idx  := map_index(emp,  function((r) -> record(key: r.dept_id, value: r)))
    dept_idx := map_index(dept, function((r) -> record(key: r.id, value: r)))

    matched   := join(emp_idx, dept_idx, function((k, e, d) ->
                     record(name: e.name, dname: cast(d.dname, optional(string)))))
    unmatched := antijoin(emp_idx, dept_idx)
    nulled    := map(unmatched, function((k, e) ->
                     record(name: e.name, dname: cast(NONE, optional(string)))))
    out       := plus(matched, nulled)

  # `cast(d.dname, optional(string))` widens the matched side so both halves
  # share one batch type, and `cast(NONE, optional(string))` is how the absent
  # counterpart is written — a bare `NONE` in a record field has no type to
  # infer.
  input:
    - emp:
        - [1, {name: "ana", dept_id: 1}]
        - [1, {name: "bo", dept_id: 99}]
      dept:
        - [1, {id: 1, dname: "sales"}]
    # The missing department arrives: the null-extended row must retract and the
    # matched row take its place, which is the incremental behaviour that makes
    # this worth expressing as a dataflow rather than a re-query.
    - dept:
        - [1, {id: 99, dname: "ops"}]

  expected_exact_output:
    - out:
        - [1, {name: "ana", dname: "sales"}]
        - [1, {name: "bo", dname: null}]
    - out:
        - [-1, {name: "bo", dname: null}]
        - [1, {name: "bo", dname: "ops"}]
