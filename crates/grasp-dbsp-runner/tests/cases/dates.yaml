# `date`, `time` and `timestamp`.
#
# Deliberately not `temporal.yaml`, which is about `integrate` and its
# neighbours — time as *ordering* rather than time as a value.
#
# Each is a scalar: it orders, it keys a dict, and it travels as a string in the
# one spelling its own parser reads back. A `timestamp` is always UTC — there are
# no timezones here — which is what lets an instant be one number.

- name: the three types carry values
  source: |
    t := input("t")
    t :: zset(record(d: date, tm: time, ts: timestamp))

    out := map(t, function((r) -> record(d: r.d, tm: r.tm, ts: r.ts)))

  input:
    - t:
        - [1, {d: "2024-01-15", tm: "14:30:00", ts: "2024-01-15 14:30:00"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15", tm: "14:30:00", ts: "2024-01-15 14:30:00"}]

- name: microseconds survive the round trip
  source: |
    t := input("t")
    t :: zset(record(tm: time, ts: timestamp))

    out := map(t, function((r) -> record(tm: r.tm, ts: r.ts)))

  input:
    - t:
        - [1, {tm: "14:30:00.123456", ts: "2024-01-15 14:30:00.123456"}]

  expected_exact_output:
    - out:
        - [1, {tm: "14:30:00.123456", ts: "2024-01-15 14:30:00.123456"}]

# Ordering is the instant, which is what makes them scalars: `min` and `max`
# fold them, and the comparison operators work.
- name: dates order as dates
  source: |
    t := input("t")
    t :: zset(record(k: i64, d: date))

    by_k := map_index(t, function((r) -> record(key: r.k, value: r)))
    earliest := aggregate(by_k, min, function((v) -> v.d))

  input:
    - t:
        - [1, {k: 1, d: "2024-03-01"}]
        - [1, {k: 1, d: "2023-12-31"}]
        - [1, {k: 1, d: "2024-01-15"}]

  expected_exact_output:
    - earliest:
        - [1, 1, "2023-12-31"]

- name: a comparison filters on the instant
  source: |
    t := input("t")
    t :: zset(record(ts: timestamp, cutoff: timestamp))

    recent := filter(t, function((r) -> r.ts > r.cutoff))

  input:
    - t:
        - [1, {ts: "2023-06-01 12:00:00", cutoff: "2024-01-01 00:00:00"}]
        - [1, {ts: "2024-06-01 12:00:00", cutoff: "2024-01-01 00:00:00"}]

  expected_exact_output:
    - recent:
        - [1, {ts: "2024-06-01 12:00:00", cutoff: "2024-01-01 00:00:00"}]

# Text is how a temporal value arrives from outside, and parsing may fail — so
# the conversion is fallible and the target must say so, the rule every other
# parse in this language follows.
- name: text converts to a date, and may fail
  source: |
    t := input("t")
    t :: zset(record(s: string))

    out := map(t, function((r) -> record(d: cast(r.s, optional(date)))))

  input:
    - t:
        - [1, {s: "2024-01-15"}]
        - [1, {s: "the fifteenth"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15"}]
        - [1, {d: null}]

- name: and a date converts back to text
  source: |
    t := input("t")
    t :: zset(record(d: date, tm: time))

    out := map(t, function((r) -> record(d: cast(r.d, string), tm: cast(r.tm, string))))

  input:
    - t:
        - [1, {d: "2024-01-15", tm: "14:30:00.123456"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15", tm: "14:30:00.123456"}]

# A key type owes one string spelling its own type reads back, and each of the
# three has one — so each may key a dict.
- name: a date keys a dict
  source: |
    t := input("t")
    t :: zset(record(n: i64, d: date))

    out := map(t, function((r) -> record(by_day: {r.d => r.n})))

  input:
    - t:
        - [1, {n: 7, d: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {by_day: {"2024-01-15": 7}}]

- name: a date joins
  source: |
    sale := input("sale")
    sale :: zset(record(d: date, amount: i64))
    holiday := input("holiday")
    holiday :: zset(record(d: date, name: string))

    by_sale := map_index(sale, function((r) -> record(key: r.d, value: r.amount)))
    by_holiday := map_index(holiday, function((r) -> record(key: r.d, value: r.name)))
    on_holiday := join(by_sale, by_holiday,
        function((k, a, b) -> record(d: k, amount: a, name: b)))

  input:
    - sale:
        - [1, {d: "2024-01-01", amount: 10}]
        - [1, {d: "2024-01-02", amount: 20}]
      holiday:
        - [1, {d: "2024-01-01", name: "new year"}]

  expected_exact_output:
    - on_holiday:
        - [1, {d: "2024-01-01", amount: 10, name: "new year"}]

# Extraction from a document, which is the same round trip read from the other
# side.
- name: a date extracts from a document
  source: |
    t := input("t")
    t :: zset(record(doc: json))

    out := map(t, function((r) -> record(d: cast(get(r.doc, "when"), optional(date)))))

  input:
    - t:
        - [1, {doc: {when: "2024-01-15"}}]
        - [1, {doc: {when: "not a date"}}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15"}]
        - [1, {d: null}]

# -- construction -------------------------------------------------------------
#
# `optional`, because not every triple of integers is a date. That is the shape
# `/` already has, and it is what a frontend turns into a dropped row.

- name: a date from its components
  source: |
    t := input("t")
    t :: zset(record(y: i64, m: i64, d: i64))

    out := map(t, function((r) -> record(d: make_date(r.y, r.m, r.d))))

  input:
    - t:
        - [1, {y: 2024, m: 2, d: 29}]
        - [1, {y: 2023, m: 2, d: 29}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-02-29"}]
        - [1, {d: null}]

- name: a time from its components, to the microsecond
  source: |
    t := input("t")
    t :: zset(record(h: i64, m: i64, s: i64, us: i64))

    out := map(t, function((r) -> record(t: make_time(r.h, r.m, r.s, r.us))))

  input:
    - t:
        - [1, {h: 14, m: 30, s: 5, us: 123456}]
        - [1, {h: 14, m: 30, s: 5, us: 0}]
        - [1, {h: 25, m: 0, s: 0, us: 0}]

  expected_exact_output:
    - out:
        - [1, {t: "14:30:05.123456"}]
        - [1, {t: "14:30:05"}]
        - [1, {t: null}]

- name: a date and a time make an instant, and it comes apart again
  source: |
    t := input("t")
    t :: zset(record(d: date, tm: time))

    made := map(t, function((r) -> record(ts: make_timestamp(r.d, r.tm))))
    back := map(made, function((r) -> record(
        d: cast(r.ts, date),
        tm: cast(r.ts, time))))

  input:
    - t:
        - [1, {d: "2024-01-15", tm: "14:30:05.123456"}]

  expected_exact_output:
    - made:
        - [1, {ts: "2024-01-15 14:30:05.123456"}]
      back:
        - [1, {d: "2024-01-15", tm: "14:30:05.123456"}]

- name: an instant is microseconds since the epoch, both ways
  source: |
    t := input("t")
    t :: zset(record(n: i64))

    out := map(t, function((r) -> record(
        ts: timestamp_from_micros(r.n),
        back: epoch_micros(timestamp_from_micros(r.n)))))

  input:
    - t:
        - [1, {n: 0}]
        - [1, {n: 1705329005123456}]

  expected_exact_output:
    - out:
        - [1, {ts: "1970-01-01 00:00:00", back: 0}]
        - [1, {ts: "2024-01-15 14:30:05.123456", back: 1705329005123456}]

- name: a date is days since the epoch, which is what a difference counts
  source: |
    t := input("t")
    t :: zset(record(a: date, b: date))

    out := map(t, function((r) -> record(days: epoch_days(r.a) - epoch_days(r.b))))

  input:
    - t:
        - [1, {a: "2024-03-01", b: "2024-02-01"}]

  expected_exact_output:
    - out:
        - [1, {days: 29}]

# -- components ---------------------------------------------------------------
#
# Each reads the one type that holds it, so a component of a `timestamp` goes
# through `cast` — one name over one type rather than a family.

- name: the components of a date and a time
  source: |
    t := input("t")
    t :: zset(record(d: date, tm: time))

    out := map(t, function((r) -> record(
        y: year(r.d), mo: month(r.d), dy: day(r.d),
        h: hour(r.tm), mi: minute(r.tm), s: second(r.tm), us: microsecond(r.tm))))

  input:
    - t:
        - [1, {d: "2024-02-29", tm: "14:30:05.123456"}]

  expected_exact_output:
    - out:
        - [1, {y: 2024, mo: 2, dy: 29, h: 14, mi: 30, s: 5, us: 123456}]

# A component reads either type that holds it, the way `length` reads a string,
# an array or a dict — so an instant is taken directly.
- name: a component of an instant needs no conversion
  source: |
    t := input("t")
    t :: zset(record(ts: timestamp))

    out := map(t, function((r) -> record(y: year(r.ts), h: hour(r.ts))))

  input:
    - t:
        - [1, {ts: "2024-01-15 14:30:05"}]

  expected_exact_output:
    - out:
        - [1, {y: 2024, h: 14}]

- name: and reads nothing that does not hold it
  source: |
    t := input("t")
    t :: zset(record(d: date))

    out := map(t, function((r) -> record(h: hour(r.d))))
  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "`hour` reads `time` or `timestamp`, found `date`"

# -- interval -----------------------------------------------------------------
#
# A span of time, in microseconds. One integer, because with no timezone a day
# is exactly 86400 seconds and every unit below a month converts exactly. Months
# are the one that does not, and they are not in this type.
#
# It orders, so `min` folds it and it may key a dict. On the wire it is an ISO
# 8601 duration.

- name: an interval is written as a duration
  source: |
    t := input("t")
    t :: zset(record(n: i64))

    out := map(t, function((r) -> record(iv: make_interval(r.n))))

  input:
    - t:
        - [1, {n: 0}]
        - [1, {n: 1000000}]
        - [1, {n: 90061000000}]
        - [1, {n: 1500000}]
        - [1, {n: -3600000000}]

  expected_exact_output:
    - out:
        - [1, {iv: "PT0S"}]
        - [1, {iv: "PT1S"}]
        - [1, {iv: "P1DT1H1M1S"}]
        - [1, {iv: "PT1.5S"}]
        - [1, {iv: "-PT1H"}]

- name: and read back from one
  source: |
    t := input("t")
    t :: zset(record(s: string))

    out := map(t, function((r) -> record(s: r.s, iv: cast(r.s, optional(interval)))))

  input:
    - t:
        - [1, {s: "P1DT1H1M1S"}]
        - [1, {s: "PT1.5S"}]
        - [1, {s: "-PT1H"}]
        - [1, {s: "P1M"}]
        - [1, {s: "an hour"}]

  expected_exact_output:
    - out:
        - [1, {s: "P1DT1H1M1S", iv: "P1DT1H1M1S"}]
        - [1, {s: "PT1.5S", iv: "PT1.5S"}]
        - [1, {s: "-PT1H", iv: "-PT1H"}]
        # No month designator: `P1M` is a span this type cannot hold.
        - [1, {s: "P1M", iv: null}]
        - [1, {s: "an hour", iv: null}]

# Every unit below a month converts exactly, so two spellings of one span are
# one value.
- name: a day and twenty-four hours are one interval
  source: |
    t := input("t")
    t :: zset(record(a: interval, b: interval))

    out := map(t, function((r) -> record(same: r.a == r.b)))

  input:
    - t:
        - [1, {a: "P1D", b: "PT24H"}]

  expected_exact_output:
    - out:
        - [1, {same: true}]

- name: the whole units of a span
  source: |
    t := input("t")
    t :: zset(record(iv: interval))

    out := map(t, function((r) -> record(
        d: total_days(r.iv), h: total_hours(r.iv), m: total_minutes(r.iv),
        s: total_seconds(r.iv), us: total_microseconds(r.iv))))

  input:
    - t:
        - [1, {iv: "P1DT1H"}]

  expected_exact_output:
    - out:
        - [1, {d: 1, h: 25, m: 1500, s: 90000, us: 90000000000}]

# -- temporal arithmetic ------------------------------------------------------

- name: a difference between two of a kind
  source: |
    t := input("t")
    t :: zset(record(d1: date, d2: date, t1: time, t2: time, s1: timestamp, s2: timestamp))

    out := map(t, function((r) -> record(
        days: r.d1 - r.d2, times: r.t1 - r.t2, stamps: r.s1 - r.s2)))

  input:
    - t:
        - [1, {d1: "2024-03-01", d2: "2024-02-01",
               t1: "14:30:00", t2: "14:00:00",
               s1: "2024-01-01 00:00:01", s2: "2024-01-01 00:00:00"}]

  expected_exact_output:
    - out:
        - [1, {days: "P29D", times: "PT30M", stamps: "PT1S"}]

- name: an instant shifts exactly, in either order
  source: |
    t := input("t")
    t :: zset(record(ts: timestamp, iv: interval))

    out := map(t, function((r) -> record(
        later: r.ts + r.iv, earlier: r.ts - r.iv, commuted: r.iv + r.ts)))

  input:
    - t:
        - [1, {ts: "2024-01-15 12:00:00", iv: "PT90M"}]

  expected_exact_output:
    - out:
        - [1, {later: "2024-01-15 13:30:00", earlier: "2024-01-15 10:30:00",
               commuted: "2024-01-15 13:30:00"}]

- name: a time wraps at midnight
  source: |
    t := input("t")
    t :: zset(record(tm: time, iv: interval))

    out := map(t, function((r) -> record(later: r.tm + r.iv)))

  input:
    - t:
        - [1, {tm: "23:30:00", iv: "PT1H"}]

  expected_exact_output:
    - out:
        - [1, {later: "00:30:00"}]

# A date has no sub-day resolution, so a shift truncates toward zero. Total, and
# the one lossy rule here — pinned in both directions.
- name: a date shifts by whole days, truncating
  source: |
    t := input("t")
    t :: zset(record(d: date, iv: interval))

    out := map(t, function((r) -> record(iv: r.iv, later: r.d + r.iv)))

  input:
    - t:
        - [1, {d: "2024-01-15", iv: "P1D"}]
        - [1, {d: "2024-01-15", iv: "PT30H"}]
        - [1, {d: "2024-01-15", iv: "PT1H"}]
        - [1, {d: "2024-01-15", iv: "-PT1H"}]

  expected_exact_output:
    - out:
        - [1, {iv: "P1D", later: "2024-01-16"}]
        # `PT30H` comes back canonical: one value, one spelling.
        - [1, {iv: "P1DT6H", later: "2024-01-16"}]
        - [1, {iv: "PT1H", later: "2024-01-15"}]
        - [1, {iv: "-PT1H", later: "2024-01-15"}]

- name: intervals add and subtract
  source: |
    t := input("t")
    t :: zset(record(a: interval, b: interval))

    out := map(t, function((r) -> record(sum: r.a + r.b, diff: r.a - r.b)))

  input:
    - t:
        - [1, {a: "PT2H", b: "PT30M"}]

  expected_exact_output:
    - out:
        - [1, {sum: "PT2H30M", diff: "PT1H30M"}]

- name: an interval orders, so min folds it
  source: |
    t := input("t")
    t :: zset(record(k: i64, iv: interval))

    by_k := map_index(t, function((r) -> record(key: r.k, value: r)))
    shortest := aggregate(by_k, min, function((v) -> v.iv))

  input:
    - t:
        - [1, {k: 1, iv: "PT2H"}]
        - [1, {k: 1, iv: "PT30M"}]

  expected_exact_output:
    - shortest:
        - [1, 1, "PT30M"]

# JSON has no date and no duration, so a document holds these as text, in the
# one spelling their own parser reads back — the same spelling a column of them
# writes. So a value cast into a document and narrowed back out is the value.
- name: a temporal value casts into a document, and back
  source: |
    t := input("t")
    t :: zset(record(d: date, tm: time, ts: timestamp, iv: interval))

    out := map(t, function((r) -> record(
        d: cast(r.d, json), tm: cast(r.tm, json),
        ts: cast(r.ts, json), iv: cast(r.iv, json),
        back: cast(cast(r.iv, json), optional(interval)))))

  input:
    - t:
        - [1, {d: "2024-01-15", tm: "14:30:00", ts: "2024-01-15 14:30:00", iv: "PT1H"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15", tm: "14:30:00", ts: "2024-01-15 14:30:00",
               iv: "PT1H", back: "PT1H"}]
