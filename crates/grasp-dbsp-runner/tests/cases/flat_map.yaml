# flat_map and flat_map_index. The list body is syntax, not a value: it says
# how many rows the operator emits per input row, and no list is ever streamed.

- name: one row fans out into two
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    tags := flat_map(emp, function((r) ->
        [record(id: r.id, tag: "primary"),
         record(id: r.id, tag: "backup")]))

  input:
    - emp:
        - [1, {id: 1}]

  expected_exact_output:
    - tags:
        - [1, {id: 1, tag: "primary"}]
        - [1, {id: 1, tag: "backup"}]

- name: a single-element list is just map
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    out := flat_map(emp, function((r) -> [record(id: r.id)]))

  input:
    - emp:
        - [1, {id: 1}]

  expected_exact_output:
    - out:
        - [1, {id: 1}]

- name: fan-out multiplies weights
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    two := flat_map(emp, function((r) -> [record(v: r.id), record(v: r.id + 100)]))

  input:
    - emp:
        - [2, {id: 1}]

  expected_exact_output:
    - two:
        - [2, {v: 1}]
        - [2, {v: 101}]

- name: identical rows in one list consolidate
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    dup := flat_map(emp, function((r) -> [record(id: r.id), record(id: r.id)]))

  input:
    - emp:
        - [1, {id: 1}]

  # Both elements produce the same row, so the weights add.
  expected_exact_output:
    - dup:
        - [2, {id: 1}]

- name: flat_map_index emits several keys per row
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, mgr_id: i64))
    both := flat_map_index(emp, function((r) ->
        [record(key: r.dept_id, value: record(id: r.id)),
         record(key: r.mgr_id, value: record(id: r.id))]))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, mgr_id: 20}]

  expected_exact_output:
    - both:
        - [1, 10, {id: 1}]
        - [1, 20, {id: 1}]

- name: a flat_map_index result joins like any other indexed stream
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, mgr_id: i64))
    dept := input("dept")
    dept :: zset(record(id: i64, dname: string))
    ei := flat_map_index(emp, function((r) ->
        [record(key: r.dept_id, value: record(id: r.id)), record(key: r.mgr_id, value: record(id: r.id))]))
    di := map_index(dept, function((r) -> record(key: r.id, value: record(dname: r.dname))))
    j  := join(ei, di, function((k, e, d) -> record(id: e.id, dname: d.dname)))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, mgr_id: 20}]
      dept:
        - [1, {id: 10, dname: "eng"}]
        - [1, {id: 20, dname: "ops"}]

  expected_exact_output:
    - j:
        - [1, {id: 1, dname: "eng"}]
        - [1, {id: 1, dname: "ops"}]

# --- Arrays are values ------------------------------------------------------

- name: fan-out follows the data, not the source
  source: |
    posts := input("posts")
    posts :: zset(record(id: i64, tags: array(string)))
    tags := flat_map(posts, function((r) -> r.tags))

  # The array comes out of the row, so one input row emits as many rows as it
  # happens to carry — none, one, or three. With `[...]` as fan-out *syntax*
  # the count was fixed by the program text and this was not expressible at
  # all; it is what a SQL frontend needs for `UNNEST`.
  input:
    - posts:
        - [1, {id: 1, tags: ["a", "b", "c"]}]
        - [1, {id: 2, tags: ["b"]}]
        - [1, {id: 3, tags: []}]

  expected_exact_output:
    - tags:
        - [2, "b"]
        - [1, "a"]
        - [1, "c"]

- name: an array survives a round trip, and length measures it
  source: |
    posts := input("posts")
    posts :: zset(record(id: i64, tags: array(string)))
    out := map(posts, function((r) -> record(tags: r.tags, n: length(r.tags))))

  input:
    - posts:
        - [1, {id: 1, tags: ["a", "b"]}]

  expected_exact_output:
    - out:
        - [1, {tags: ["a", "b"], n: 2}]

- name: the whole mapping family takes either stream shape
  source: |
    a := input("a")
    a :: zset(record(k: i64, tags: array(string)))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))

    flattened := map(idx, function((k, v) -> record(k: k, n: length(v.tags))))
    rekeyed   := map_index(idx, function((k, v) -> record(key: length(v.tags), value: v)))
    exploded  := flat_map(idx, function((k, v) -> v.tags))

  # `filter` always took either shape, feeding one row for a flat stream and
  # `(key, value)` for an indexed one. The rest of the family now follows the
  # same rule, and the *result* shape comes from what the function returns
  # rather than from what it was given — which is why `map` over an indexed
  # stream flattens it.
  input:
    - a:
        - [1, {k: 7, tags: ["x", "y"]}]

  expected_exact_output:
    - flattened:
        - [1, {k: 7, n: 2}]
      rekeyed:
        - [1, 2, {k: 7, tags: ["x", "y"]}]
      exploded:
        - [1, "x"]
        - [1, "y"]

# `map_array` is one of the two constructs in the language that bind a name
# inside an
# expression. It exists because a `flat_map`'s function returns an array and
# there was no way to *build* one from another array — so a row's other columns
# could not survive a fan-out. The operator did not change; the expression
# language grew.

- name: map_array carries the row through a fan-out
  source: |
    person := input("person")
    person :: zset(record(name: string, tags: array(string)))
    tagged := flat_map(person, function((r) ->
        map_array(r.tags, function((e) -> record(name: r.name, tag: e)))))

  input:
    - person:
        - [1, {name: "ann", tags: ["x", "y"]}]
        - [1, {name: "bo", tags: ["z"]}]

  expected_exact_output:
    - tagged:
        - [1, {name: "ann", tag: "x"}]
        - [1, {name: "ann", tag: "y"}]
        - [1, {name: "bo", tag: "z"}]

# `entries` already yields `array(record(key, value))`, so a dict fans out
# through the same shape.
- name: map_array over a dict's entries
  source: |
    person := input("person")
    person :: zset(record(name: string, tags: dict(string, i64)))
    tagged := flat_map(person, function((r) ->
        map_array(entries(r.tags), function((e) ->
            record(name: r.name, tag: e.key, n: e.value)))))

  input:
    - person:
        - [1, {name: "ann", tags: {"x": 1, "y": 2}}]

  expected_exact_output:
    - tagged:
        - [1, {name: "ann", tag: "x", n: 1}]
        - [1, {name: "ann", tag: "y", n: 2}]

- name: a map_array in an ordinary map builds an array
  source: |
    nums := input("nums")
    nums :: zset(record(id: i64, xs: array(i64)))
    doubled := map(nums, function((r) ->
        record(id: r.id, xs: map_array(r.xs, function((e) -> e * 2)))))

  input:
    - nums:
        - [1, {id: 1, xs: [1, 2, 3]}]

  expected_exact_output:
    - doubled:
        - [1, {id: 1, xs: [2, 4, 6]}]

- name: array functions nest, and each binder keeps its own slot
  source: |
    g := input("g")
    g :: zset(record(k: i64, rows: array(record(v: i64, ns: array(i64)))))
    out := flat_map(g, function((r) ->
        map_array(r.rows, function((a) ->
            record(k: r.k, v: a.v, total: map_array(a.ns, function((b) -> b + a.v)))))))

  input:
    - g:
        - [1, {k: 7, rows: [{v: 10, ns: [1, 2]}]}]

  expected_exact_output:
    - out:
        - [1, {k: 7, v: 10, total: [11, 12]}]

# The case the binder scheme exists for: a named function that binds a `map_array`
# around a use of its own parameter, called from inside another `map_array`. The
# argument is itself a binder reference, so it has to survive being substituted
# under one. Without the shift in `instantiate` this quietly computes `w + w`.
- name: a function binding a map_array, called from inside one
  source: |
    function g(a) { return map_array(a.ns, function((w) -> w + a.v)) }
    t := input("t")
    t :: zset(record(k: i64, rows: array(record(v: i64, ns: array(i64)))))
    out := flat_map(t, function((r) ->
        map_array(r.rows, function((e) -> record(k: r.k, got: g(e))))))

  input:
    - t:
        - [1, {k: 1, rows: [{v: 100, ns: [1, 2]}]}]

  expected_exact_output:
    - out:
        - [1, {k: 1, got: [101, 102]}]

- name: a map_array may not shadow a name in scope
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map(t, function((r) -> record(v: map_array(r.xs, function((r) -> r)))))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "already in scope"

- name: map_array needs an array
  source: |
    t := input("t")
    t :: zset(record(v: i64))
    out := map(t, function((r) -> record(v: map_array(r.v, function((e) -> e)))))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "`map_array` needs an array"

- name: map_array is an expression, not an operator
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map_array(t, function((e) -> e))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "`map_array` is an expression, not an operator"

- name: map_array's second argument must be a function
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map(t, function((r) -> record(v: map_array(r.xs, r.xs))))

  expected_diagnostics:
    - severity: error
      pass: parse
      message: "must be a function"

# Two is the element and its index. Three is nothing.
- name: an array function's function takes at most two parameters
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map(t, function((r) -> record(v: map_array(r.xs, function((a, b, c) -> a)))))

  expected_diagnostics:
    - severity: error
      pass: parse
      message: "found 3 parameters"

# The index binder: 0-based, `i64`, and named only if wanted.
- name: map_array binds an element's index
  source: |
    t := input("t")
    t :: zset(record(id: i64, xs: array(string)))
    out := flat_map(t, function((r) ->
        map_array(r.xs, function((e, i) -> record(id: r.id, at: i, tag: e)))))

  input:
    - t:
        - [1, {id: 1, xs: ["a", "b", "c"]}]

  expected_output:
    - out:
        - [1, {id: 1, at: 0, tag: "a"}]
        - [1, {id: 1, at: 1, tag: "b"}]
        - [1, {id: 1, at: 2, tag: "c"}]

# The index is a slot whether or not it is named, so the inner binder of a
# nested pair sits two along rather than one. Nothing about that is visible in
# the language — this is here because it is the invariant the frame rests on,
# and a body reading the wrong slot would compute quietly wrong answers.
- name: a named index does not move an outer binder
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map(t, function((r) ->
        record(v: map_array(r.xs, function((e, i) ->
            map_array(r.xs, function((f, j) -> e + f + i + j)))))))

  input:
    - t:
        - [1, {xs: [10, 20]}]

  expected_output:
    - out:
        - [1, {v: [[20, 31], [31, 42]]}]

# The two binders are one parameter list, so `param_list`'s own rule covers
# them and there is no second check to keep in step with it.
- name: the element and its index may not share a name
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map(t, function((r) -> record(v: map_array(r.xs, function((e, e) -> e)))))

  expected_diagnostics:
    - severity: error
      pass: parse
      message: "bound twice"

# `filter_array` — the length-changing sibling. Its function is a predicate and
# what comes back is the elements it kept, in order.
- name: filter_array keeps the elements its function admits
  source: |
    t := input("t")
    t :: zset(record(id: i64, xs: array(i64)))
    out := map(t, function((r) ->
        record(id: r.id, xs: filter_array(r.xs, function((e) -> e > 2)))))

  input:
    - t:
        - [1, {id: 1, xs: [1, 2, 3, 4]}]
        - [1, {id: 2, xs: [1, 1]}]

  expected_output:
    - out:
        - [1, {id: 1, xs: [3, 4]}]
        - [1, {id: 2, xs: []}]

# Which is what a slice is, given the index.
- name: filter_array over the index is a slice
  source: |
    t := input("t")
    t :: zset(record(xs: array(string)))
    out := map(t, function((r) ->
        record(xs: filter_array(r.xs, function((e, i) -> i >= 2)))))

  input:
    - t:
        - [1, {xs: ["a", "b", "c", "d"]}]

  expected_output:
    - out:
        - [1, {xs: ["c", "d"]}]

# And with `dict` and `entries` around it, subtracting keys from a dict.
- name: filter_array over entries drops a dict's keys
  source: |
    t := input("t")
    t :: zset(record(d: dict(string, i64)))
    out := map(t, function((r) ->
        record(d: dict(filter_array(entries(r.d), function((e) -> e.key != "b"))))))

  input:
    - t:
        - [1, {d: {"a": 1, "b": 2, "c": 3}}]

  expected_output:
    - out:
        - [1, {d: {"a": 1, "c": 3}}]

- name: filter_array's function must return a boolean
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := map(t, function((r) -> record(v: filter_array(r.xs, function((e) -> e)))))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "`filter_array`'s function must return `bool`"

- name: filter_array is an expression, not an operator
  source: |
    t := input("t")
    t :: zset(record(xs: array(i64)))
    out := filter_array(t, function((e) -> true))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "`filter_array` is an expression, not an operator"
