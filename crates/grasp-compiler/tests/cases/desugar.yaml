# The desugaring table — `docs/grasp/semantics.md`, "Desugaring".
#
# Each row is a claim that one surface form *means* another. `equivalent_to`
# tests it directly: both spellings must emit the same grasp-dbsp. Nothing here
# needs the core form to be exposed.
#
# `equivalent_to` proves the two agree, not that either is right — which is why
# this file also carries `expected_ok` cases over the same sources, and why
# `recursion.yaml` and `smoke.yaml` run the same constructs end to end.

# `x:` in an atom or head  ->  `x: x`
- name: the shorthand argument means the column's own name
  source: |
    r(x:) <-
        s(x:)
  equivalent_to: |
    r(x: x) <-
        s(x: x)

- name: shorthand and explicit arguments mixed
  source: |
    r(x:, y: v) <-
        s(x:, y: v)
  equivalent_to: |
    r(x: x, y: v) <-
        s(x: x, y: v)

# `a ++ b`  ->  `concat(a, b)`
- name: concatenation is concat
  source: |
    r(v: n) <-
        s(a: a, b: b)
        n := a ++ b
  equivalent_to: |
    r(v: n) <-
        s(a: a, b: b)
        n := concat(a, b)

- name: chained concatenation nests to the left
  source: |
    r(v: n) <-
        s(a: a, b: b, c: c)
        n := a ++ b ++ c
  equivalent_to: |
    r(v: n) <-
        s(a: a, b: b, c: c)
        n := concat(concat(a, b), c)

# `{a: v}`  ->  `{"a" => v}`  and  `{"a": v}`  ->  `{"a" => v}`
- name: the colon dict form is the arrow form with a string key
  source: |
    r(v: d) <-
        s(x: x)
        d := {a: x}
  equivalent_to: |
    r(v: d) <-
        s(x: x)
        d := {"a" => x}

- name: a quoted colon key is the same
  source: |
    r(v: d) <-
        s(x: x)
        d := {"a": x}
  equivalent_to: |
    r(v: d) <-
        s(x: x)
        d := {"a" => x}

- name: the two spellings mixed in one literal
  source: |
    r(v: d) <-
        s(x: x, y: y)
        d := {a: x, "b" => y}
  equivalent_to: |
    r(v: d) <-
        s(x: x, y: y)
        d := {"a" => x, "b" => y}

# `s.f`  ->  `record:get(s, "f")`
- name: field access is record:get
  source: |
    r(v: n) <-
        s(rec: rec)
        n := rec.f
  equivalent_to: |
    r(v: n) <-
        s(rec: rec)
        n := record:get(rec, "f")

# `s.a.b`  ->  `record:get(record:get(s, "a"), "b")`
- name: chained field access nests
  source: |
    r(v: n) <-
        s(rec: rec)
        n := rec.a.b
  equivalent_to: |
    r(v: n) <-
        s(rec: rec)
        n := record:get(record:get(rec, "a"), "b")

# `not e` in an expression  ->  `boolean:not(e)`
- name: not in an expression is boolean:not
  source: |
    r(v: n) <-
        s(a: a)
        n := not a
  equivalent_to: |
    r(v: n) <-
        s(a: a)
        n := boolean:not(a)

# The sugar is gone before the join graph, so a program mixing all of it is the
# same program as its expansion.
- name: every sugar at once
  source: |
    r(x:, v: n) <-
        s(x:, rec: rec, a: a, b: b)
        n := {tag: rec.f, joined: a ++ b}
  equivalent_to: |
    r(x: x, v: n) <-
        s(x: x, rec: rec, a: a, b: b)
        n := {"tag" => record:get(rec, "f"), "joined" => concat(a, b)}

# `equivalent_to` says nothing about whether either side is right, so pin the
# sources here too.
- name: the sugared forms are all legal programs
  source: |
    r(x:, v: n, w: d) <-
        s(x:, rec: rec, a: a, b: b)
        n := not (a ++ b = "x")
        d := {tag: rec.f}
  expected_ok: true

- name: the expanded forms are all legal programs
  source: |
    r(x: x, v: n, w: d) <-
        s(x: x, rec: rec, a: a, b: b)
        n := boolean:not(concat(a, b) = "x")
        d := {"tag" => record:get(rec, "f")}
  expected_ok: true
