# The productions of `docs/grasp/syntax.md`, "Grammar".

# spec ::= relation_name "::" "relation" "(" [col_types] ")"
- name: a relation spec
  source: |
    edge :: relation(src: i64, dst: i64)
  expected_ok: true

- name: a spec over every type in the vocabulary
  source: |
    wide :: relation(
        b: boolean,
        i: i64,
        f: f64,
        s: string,
        j: json,
        o: optional(string),
        r: record(a: i64, b: string),
        a: array(i64),
        d: dict(string, i64),
    )
  expected_ok: true

- name: a spec with no columns
  source: |
    unit :: relation()
  expected_ok: true

- name: a nested type
  source: |
    nest :: relation(v: array(record(k: string, vs: dict(i64, array(f64)))))
  expected_ok: true

# fact ::= relation_name "(" [kv_args] ")"
- name: facts
  source: |
    edge(src: 1, dst: 2)
    edge(src: 2, dst: 3)
  expected_ok: true

- name: a fact with no arguments
  source: |
    tick()
  expected_ok: true

# single_line_rule ::= head "<-" body_stmt
- name: a single-line rule takes exactly one body statement
  source: |
    copy(x: x) <- source(x: x)
  expected_ok: true

# The grammar accepts a bare filter as a body, and safety then rejects this one:
# `x` is used by the head and bound by nothing. Asserting the rejection says both
# halves at once — and keeps the case from passing today for the right reason and
# failing later for the wrong one.
- name: a single-line rule with a filter body, which safety then rejects
  source: |
    big(v: x) <- x > 3
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "nothing in the body binds it"

# multiline_rule ::= head "<-" NEWLINE (INDENT body_stmt NEWLINE)+
- name: a multiline rule
  source: |
    result(name: n, title: t) <-
        student(id: s, name: n, age: a)
        a > 20
        course(id: s, title: t)
        not enrolled(student: s, course: s)
  expected_ok: true

# kv_arg ::= name ":" expr | name ":" | name ":" "_"
- name: the three kv_arg forms
  source: |
    r(explicit: 1, shorthand:, ignored: _) <-
        s(shorthand: shorthand)
  expected_ok: true

- name: trailing commas are allowed
  source: |
    spec :: relation(a: i64, b: i64,)
    fact(a: 1, b: 2,)
  expected_ok: true

# input_stmt ::= "input"
- name: an external relation
  source: |
    edge :: relation(src: i64, dst: i64)
    edge(src:, dst:) <- input
  expected_ok: true

# type_assertion ::= variable "::" type
- name: a type assertion in a body
  source: |
    named(name: n) <-
        person(name: n)
        n :: string
  expected_ok: true

# negated_atom ::= "not" positive_atom
- name: a negated atom
  source: |
    alone(id: i) <-
        person(id: i)
        not enrolled(student: i)
  expected_ok: true

# aggregate ::= aggregator "<" [expr] ">"
- name: every aggregator
  source: |
    stats(dept: d, s: a, c: b, lo: c, hi: e, mean: f) <-
        emp(dept: d, sal: r)
        a := sum<r>
        b := count<>
        c := min<r>
        e := max<r>
        f := avg<r>
  expected_ok: true

- name: an aggregate over an expression
  source: |
    revenue(dept: d, total: t) <-
        sale(dept: d, price: p, qty: q)
        t := sum<p * q>
  expected_ok: true

# call ::= identifier "(" [args] ")" — only ever a subexpression
- name: calls with positional and keyword arguments
  source: |
    r(v: a, w: b) <-
        s(x: x, y: y)
        a := coalesce(x, 0)
        b := if(x > 1, y, x)
  expected_ok: true

- name: a call inside a filter
  source: |
    long(name: s) <-
        person(name: s)
        length(s) > 3
  expected_ok: true

# array_literal / record_literal
- name: array and record literals
  source: |
    r(a: v, b: w) <-
        s(x: x)
        v := [1, 2, 3,]
        w := record(k: x, n: 1)
  expected_ok: true

- name: an empty array literal
  source: |
    r(a: v) <-
        s(x: x)
        v := []
  expected_ok: true

# postfix ::= primary ("." name)*
- name: field access, including chained
  source: |
    r(a: v, b: w) <-
        s(rec: rec)
        v := rec.field
        w := rec.a.b
  expected_ok: true

- name: a rule head with no arguments
  source: |
    any() <- s(x: x)
  expected_ok: true

- name: several rules for one head
  source: |
    reachable(node: n) <- start(node: n)
    reachable(node: n) <-
        reachable(node: m)
        edge(src: m, dst: n)
  expected_ok: true

- name: a missing arrow is rejected
  source: |
    r(x: x) s(x: x)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "unexpected token"
      line: 1

- name: an unclosed parenthesis is rejected
  source: |
    r(x: 1
  expected_diagnostics:
    - severity: error
      pass: parse

- name: a rule with an empty body is rejected
  source: |
    r(x: x) <-
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

# `filter ::= expr -- must be boolean`. A bare call is grammatical — it is a
# filter whose expression is not boolean — so the rejection belongs to `infer`,
# not here. The message is deliberately not pinned: `inference.md` does not name
# one yet, and `pass` plus `line` are enough to keep a typo in this source from
# satisfying the case.
- name: a bare call is a filter, and must be boolean
  source: |
    r(x: x) <-
        s(x: x)
        length(x)
  expected_diagnostics:
    - severity: error
      pass: infer
      line: 3
