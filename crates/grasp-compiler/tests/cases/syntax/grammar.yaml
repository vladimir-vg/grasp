# The productions of `docs/grasp/syntax.md`, "Grammar".

# spec ::= relation_name "::" "relation" "(" [col_types] ")"
- name: a relation spec
  source: |
    edge :: relation(src: i64, dst: i64)
  expected_ok: true

- name: a spec over every type in the vocabulary
  source: |
    wide :: relation(
        b: boolean,
        i: i64,
        f: f64,
        s: string,
        j: json,
        o: optional(string),
        r: record(a: i64, b: string),
        a: array(i64),
        d: dict(string, i64),
    )
  expected_ok: true

- name: a spec with no columns
  source: |
    unit :: relation()
  expected_ok: true

- name: a nested type
  source: |
    nest :: relation(v: array(record(k: string, vs: dict(i64, array(f64)))))
  expected_ok: true

# fact ::= relation_name "(" [kv_args] ")"
- name: facts
  source: |
    edge :: relation(src: i64, dst: i64)

    edge(src: 1, dst: 2)
    edge(src: 2, dst: 3)
  expected_ok: true

- name: a fact with no arguments
  source: |
    tick()
  expected_ok: true

# single_line_rule ::= head "<-" body_stmt
- name: a single-line rule takes exactly one body statement
  source: |
    source :: relation(x: i64)

    copy(x: x) <- source(x: x)
  expected_ok: true

# multiline_rule ::= head "<-" NEWLINE (INDENT body_stmt NEWLINE)+
- name: a multiline rule
  source: |
    student :: relation(id: i64, name: string, age: i64)
    course :: relation(id: i64, title: string)
    enrolled :: relation(student: i64, course: i64)

    result(name: n, title: t) <-
        student(id: s, name: n, age: a)
        a > 20
        course(id: s, title: t)
        not enrolled(student: s, course: s)
  expected_ok: true

# kv_arg ::= name ":" expr | name ":" | name ":" "_"
#
# All three forms in an atom, which is the only place all three are legal — a
# head must produce a value for every column, so the wildcard has no meaning
# there and is rejected below.
- name: the three kv_arg forms
  source: |
    s :: relation(explicit: i64, shorthand: i64, ignored: i64)

    r(v: shorthand) <-
        s(explicit: 1, shorthand:, ignored: _)
  expected_ok: true

# "It is legal only in an atom's argument position, where 'there is a column
#  here I do not care about' is the whole meaning."
- name: the wildcard is not a head argument
  source: |
    s :: relation(x: i64)

    r(x: _) <-
        s(x: x)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "wildcard"
      line: 3

- name: the wildcard is not a fact argument
  source: |
    r :: relation(x: i64)
    r(x: _)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "wildcard"
      line: 2

- name: trailing commas are allowed
  source: |
    fact :: relation(a: i64, b: i64)

    spec :: relation(a: i64, b: i64,)
    fact(a: 1, b: 2,)
  expected_ok: true

# input_stmt ::= "input"
- name: an external relation
  source: |
    edge :: relation(src: i64, dst: i64)
    edge(src:, dst:) <- input
  expected_ok: true

# type_assertion ::= variable "::" type
- name: a type assertion in a body
  source: |
    person :: relation(name: optional(string))

    named(name: n) <-
        person(name: n)
        n :: string
  expected_ok: true

# negated_atom ::= "not" positive_atom
- name: a negated atom
  source: |
    person :: relation(id: i64)
    enrolled :: relation(student: i64)

    alone(id: i) <-
        person(id: i)
        not enrolled(student: i)
  expected_ok: true

# aggregate ::= aggregator "<" [expr] ">"
- name: every aggregator
  source: |
    emp :: relation(dept: string, sal: i64)

    stats(dept: d, s: a, c: b, lo: c, hi: e, mean: f) <-
        emp(dept: d, sal: r)
        a := sum<r>
        b := count<>
        c := min<r>
        e := max<r>
        f := avg<r>
  expected_ok: true

- name: an aggregate over an expression
  source: |
    sale :: relation(dept: string, price: i64, qty: i64)

    revenue(dept: d, total: t) <-
        sale(dept: d, price: p, qty: q)
        t := sum<p * q>
  expected_ok: true

# call ::= identifier "(" [args] ")" — only ever a subexpression
# Which variant a call means is `programs/calls.yaml`; this is the production.
- name: a call with a positional argument and a named one
  source: |
    s :: relation(x: i64, y: i64, arr: array(i64))

    r(v: a, w: b) <-
        s(x: x, y: y, arr: arr)
        a := integer:abs(x)
        b := array:at(arr, index: y)
  expected_ok: true

- name: a call inside a filter
  source: |
    person :: relation(name: string)

    long(name: s) <-
        person(name: s)
        string:length(s) > 3
  expected_ok: true

# array_literal / record_literal
- name: array and record literals
  source: |
    s :: relation(x: string)
    r :: relation(a: array(i64), b: record(k: string, n: i64))

    r(a: v, b: w) <-
        s(x: x)
        v := [1, 2, 3,]
        w := record(k: x, n: 1)
  expected_ok: true

- name: an empty array literal
  source: |
    s :: relation(x: i64)
    r :: relation(a: array(i64))

    r(a: v) <-
        s(x: x)
        v := []
  expected_ok: true

# postfix ::= primary ("." name)*
- name: field access, including chained
  source: |
    s :: relation(rec: record(field: i64, a: record(b: string)))

    r(a: v, b: w) <-
        s(rec: rec)
        v := rec.field
        w := rec.a.b
  expected_ok: true

- name: a rule head with no arguments
  source: |
    s :: relation(x: i64)

    any() <- s(x: x)
  expected_ok: true

- name: several rules for one head
  source: |
    start :: relation(node: i64)
    edge :: relation(src: i64, dst: i64)

    reachable(node: n) <- start(node: n)
    reachable(node: n) <-
        reachable(node: m)
        edge(src: m, dst: n)
  expected_ok: true

- name: a missing arrow is rejected
  source: |
    r(x: x) s(x: x)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "unexpected token"
      line: 1

- name: an unclosed parenthesis is rejected
  source: |
    r(x: 1
  expected_diagnostics:
    - severity: error
      pass: parse

- name: a rule with an empty body is rejected
  source: |
    r(x: x) <-
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1
