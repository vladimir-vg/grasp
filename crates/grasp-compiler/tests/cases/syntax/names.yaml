# Name resolution — `docs/grasp/syntax.md`, "Name resolution".

# "keywords — not, and, or, input, true, false, NONE"
- name: a keyword cannot name a relation
  source: |
    not(x: 1)
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

# A keyword the lexer turns into a token of its own is reported the way every
# other reserved word is — as a word that is taken, not as an unexpected token.
- name: a keyword that is a token is still reported as a reserved word
  source: |
    input :: relation(v: i64)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "`input` is a reserved word and cannot be a relation name"
      line: 1

- name: a keyword cannot name a column
  source: |
    r(input: 1)
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

- name: a keyword cannot name a variable
  source: |
    r(x: x) <-
        s(x: x)
        true := x
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 3

# "type names — boolean, i64, f64, string, json, optional, record, array, dict,
#  relation"
- name: a type name cannot name a relation
  source: |
    string(x: 1)
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

- name: a type name cannot name a variable
  source: |
    r(x: i64) <-
        s(x: i64)
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

# "aggregators — sum, count, min, max, avg"
- name: an aggregator cannot name a relation
  source: |
    count(x: 1)
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

# "Builtin names are not reserved as such; a column may be called `length`."
- name: a column may be called length
  source: |
    r :: relation(length: i64)

    r(length: 3)
  expected_ok: true

- name: a variable may be called length
  source: |
    s :: relation(x: i64)

    r(v: length) <-
        s(x: length)
  expected_ok: true

# And so may a relation. Every callable is namespaced, so a bare name is a
# relation's and cannot collide with one — the rule that used to say "a name is
# either a relation or a callable" is now the shape of the name.
- name: a relation may be called length
  source: |
    length :: relation(x: i64)
    length(x: 1)
  expected_ok: true

# "User code may not define names under the reserved namespace prefixes."
- name: a relation may not be defined under a reserved namespace
  source: |
    string:mine(x: 1)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "reserved"
      line: 1

- name: a namespace-qualified relation outside the reserved prefixes
  source: |
    mine:edges :: relation(src: i64, dst: i64)

    mine:edges(src: 1, dst: 2)
  expected_ok: true

# "Variables are always single-segment: no namespace."
- name: a variable may not be namespace-qualified
  source: |
    r(x: a:b) <-
        s(x: a:b)
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 1

# "The wildcard is legal only in an atom's argument position."
- name: the wildcard in an atom argument
  source: |
    s :: relation(x: i64, y: i64)

    r(x: x) <-
        s(x: x, y: _)
  expected_ok: true

- name: two wildcards in one atom are unrelated
  source: |
    s :: relation(x: i64, y: i64, z: i64)

    r(x: x) <-
        s(x: x, y: _, z: _)
  expected_ok: true

- name: the wildcard is rejected in a head argument
  source: |
    s :: relation(x: i64)
    r :: relation(x: i64)

    r(x: _) <-
        s(x: x)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "wildcard"
      line: 4

- name: the wildcard is not an expression
  source: |
    r(x: v) <-
        s(x: x)
        v := _ + 1
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "wildcard"
      line: 3

- name: the wildcard is not a filter
  source: |
    r(x: x) <-
        s(x: x)
        _ > 1
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "wildcard"
      line: 3

- name: the wildcard cannot be bound
  source: |
    r(x: x) <-
        s(x: x)
        _ := x
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "wildcard"
      line: 3

# "duplicate column `c` — one atom or head names a column twice"
- name: a duplicate column in an atom
  source: |
    r(x: x) <-
        s(a: x, a: x)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "duplicate column"
      line: 2

- name: a duplicate column in a head
  source: |
    r(x: 1, x: 2) <-
        s(y: y)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "duplicate column"
      line: 1

- name: a duplicate column in a spec
  source: |
    r :: relation(a: i64, a: string)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "duplicate column"
      line: 1

# "duplicate field `f` — one record or dict literal names a field twice"
- name: a duplicate field in a record literal
  source: |
    r(v: w) <-
        s(x: x)
        w := record(a: 1, a: 2)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "duplicate field"
      line: 3

- name: a duplicate field in a dict literal
  source: |
    r(v: w) <-
        s(x: x)
        w := {a: 1, a: 2}
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "duplicate field"
      line: 3

- name: a duplicate field in a record type
  source: |
    r :: relation(v: record(a: i64, a: string))
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "duplicate field"
      line: 1

# "The namespace `n:` is reserved for the language" — a held prefix holds
# callables, so a relation may not be declared under one.
- name: a relation cannot be declared under a held namespace
  source: |
    string:foo :: relation(v: i64)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "the namespace `string:` is reserved for the language"
      line: 1

# The wildcard's one home is an atom's argument; in a head it would be a column
# with no value.
- name: the wildcard cannot stand in a head
  source: |
    s :: relation(v: i64)
    q(v: _) <- s(v: v)
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "the wildcard `_` binds nothing and cannot be used here"
      line: 2
