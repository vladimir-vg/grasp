# Patterns — `docs/grasp/syntax.md`, "Patterns and literals share the `:`
# spelling", and the `match` production.

# unnest_pattern ":=" ("*" | "**") expr
- name: an array unnest
  source: |
    person :: relation(name: string, tags: array(string))

    item(name: n, tag: v) <-
        person(name: n, tags: arr)
        (v) := *arr
  expected_ok: true

- name: a dict unnest binds a key and a value
  source: |
    person :: relation(name: string, tags: dict(string, i64))

    tagged(name: n, tag: k) <-
        person(name: n, tags: d)
        (k, _v) := **d
  expected_ok: true

# dict_pattern
- name: an exact dict destructure
  source: |
    s :: relation(d: dict(string, i64))

    r(v: x) <-
        s(d: d)
        {a: x} := d
  expected_ok: true

- name: a dict destructure ignoring the rest
  source: |
    s :: relation(d: dict(string, i64))

    r(v: x) <-
        s(d: d)
        {a: x, **} := d
  expected_ok: true

- name: a dict destructure with several fields
  source: |
    s :: relation(d: dict(string, i64))

    r(v: x, w: y) <-
        s(d: d)
        {a: x, b: y} := d
  expected_ok: true

- name: a quoted key in a dict pattern
  source: |
    s :: relation(d: dict(string, i64))

    r(v: x) <-
        s(d: d)
        {"key with spaces": x} := d
  expected_ok: true

# record_pattern
- name: a record destructure
  source: |
    s :: relation(rec: record(a: i64))

    r(v: x) <-
        s(rec: rec)
        record(a: x) := rec
  expected_ok: true

- name: a record destructure allowing extra fields
  source: |
    s :: relation(rec: record(a: i64, b: string))

    r(v: x) <-
        s(rec: rec)
        record(a: x, **) := rec
  expected_ok: true

# `pat_field ::= dict_key ":" [variable]` — the shorthand, which is the way
# every pattern in the documents is written. `{a:}` is `{a: a}`.
- name: a dict pattern in the shorthand
  source: |
    s :: relation(d: dict(string, i64))
    s(d:) <- input

    r(v: a) <-
        s(d: d)
        {a:} := d
  expected_ok: true

- name: the shorthand beside a written-out field
  source: |
    s :: relation(d: dict(string, i64))
    s(d:) <- input

    r(v: a, w: y) <-
        s(d: d)
        {a:, b: y, **} := d
  expected_ok: true

- name: a record pattern in the shorthand
  source: |
    s :: relation(rec: record(a: i64, b: string))
    s(rec:) <- input

    r(v: a) <-
        s(rec: rec)
        record(a:, **) := rec
  expected_ok: true

# A quoted key is arbitrary text, and the shorthand needs a name a variable can
# have. Written out, the same key is fine — `a quoted key in a dict pattern`
# above.
- name: a quoted key has no shorthand
  source: |
    s :: relation(d: dict(string, i64))
    s(d:) <- input

    r(v: x) <-
        s(d: d)
        {"key with spaces":} := d
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "is not a name a variable can have"

# The shorthand names a variable, so it takes the objections a variable name
# takes. `sum` is an aggregator, and reserved.
- name: a reserved key has no shorthand either
  source: |
    s :: relation(d: dict(string, i64))
    s(d:) <- input

    r(v: x) <-
        s(d: d)
        {sum:} := d
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "reserved word"

# "`=>` is not allowed in a pattern."
- name: the arrow form is rejected in a pattern
  source: |
    r(v: x) <-
        s(d: d)
        {"a" => x} := d
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 3

# "its values must be variables, so `{a: f(1)} := d` is rejected there rather
#  than by the grammar."
- name: a pattern value must be a variable
  source: |
    r(v: x) <-
        s(d: d)
        {a: f(1)} := d
  expected_diagnostics:
    - severity: error
      pass: parse
      message: "not one"
      line: 3

- name: a pattern value may not be a literal
  source: |
    r(v: x) <-
        s(d: d)
        {a: 1} := d
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 3

- name: an unnest pattern needs at least one variable
  source: |
    r(v: x) <-
        s(arr: arr)
        () := *arr
  expected_diagnostics:
    - severity: error
      pass: parse
      line: 3

# A body statement is one per line, so an expression may not reach across one to
# take the bracket that opens the next. Both brackets: a `(` would make the
# line above a call and a `[` would make it a subscript, and in each case the
# parser would run the two lines together and report the `:=` it then trips
# over — an error naming neither line.
- name: a paren opening a line does not call the line above
  source: |
    p :: relation(a: i64, arr: array(i64))
    p(a:, arr:) <- input

    r(v: v) <-
        p(a: a, arr: arr)
        n := a
        (v) := *arr
  expected_ok: true

- name: a bracket opening a line does not subscript the line above
  source: |
    p :: relation(d: dict(string, i64), arr: array(i64))
    p(d:, arr:) <- input

    r(v: x) <-
        p(d: d, arr: arr)
        n := d
        [x, y] := arr
  expected_ok: true

# Written where it belongs, the same text is a call.
- name: a paren on the same line still calls
  source: |
    p :: relation(s: string)
    p(s:) <- input

    r(v: n) <-
        p(s: s)
        n := string:length(s)
  expected_ok: true

# A brace form is parsed once and read as a pattern only if `:=` follows, so
# the same text is a literal on the right of one.
- name: a brace on the right of the arrow is a literal, not a pattern
  source: |
    s :: relation(x: i64)

    r(v: d) <-
        s(x: x)
        d := {a: x}
  expected_ok: true

# array_pattern ::= "[" [pat_elems] ["," rest] "]"
- name: an array destructure
  source: |
    s :: relation(arr: array(i64))
    s(arr:) <- input

    r(a: x, b: y) <-
        s(arr: arr)
        [x, y] := arr
  expected_ok: true

- name: an array destructure ignoring the rest
  source: |
    s :: relation(arr: array(i64))
    s(arr:) <- input

    r(a: x) <-
        s(arr: arr)
        [x, *] := arr
  expected_ok: true

- name: an array destructure binding the rest
  source: |
    s :: relation(arr: array(i64))
    s(arr:) <- input

    r(a: x, rest: e) <-
        s(arr: arr)
        [x, *e] := arr
  expected_ok: true

- name: a dict destructure binding the rest
  source: |
    s :: relation(d: dict(string, i64))
    s(d:) <- input

    r(v: x, rest: e) <-
        s(d: d)
        {a: x, **e} := d
  expected_ok: true

# The three shapes an unnest has, and no others:
# `gordeev-automations/docs/design/grasp-core-language.md` — "`value_var` is
# always set. `key_var` set ⇔ map unnest, and then `index_var` is ABSENT.
# `index_var` set ⇔ array index+value unnest… never both set."
#
# This is the one grasp-dbsp cannot express, so it is pending rather than
# skipped: `select` maps an array element by element with no index, `get`
# covers a document and a dict but not an array, and there is no `enumerate`.
- name: an indexed array unnest
  source: |
    s :: relation(arr: array(string))
    s(arr:) <- input

    r(i: i, v: v) <-
        s(arr: arr)
        (i, v) := *arr
  expected_ok: true

# A map unnest always binds both. The wildcard-ish spelling `_v` is how the
# corpus ignores one, and the message says so rather than leaving the reader to
# find it.
- name: a dict unnest binds both a key and a value
  source: |
    s :: relation(d: dict(string, i64))
    s(d:) <- input

    r(k: k) <-
        s(d: d)
        (k) := **d
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "a dict unnest binds a key and a value"

# Any other arity at all. Without this check the pattern reaches emission,
# where the match over the three shapes has no fourth arm.
- name: an unnest binds no more than two variables
  source: |
    s :: relation(arr: array(string))
    s(arr:) <- input

    r(v: a) <-
        s(arr: arr)
        (a, b, c) := *arr
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "an array unnest binds a value, or an index and a value"
