# `dynamic` — any value, carrying what it is.
#
# `dynamic:of` is the way in and `d :: T` is the way out. A function rather than
# an implicit widening, because grasp has no implicit conversion — and its
# typespec is writable, `(T) -> dynamic`, where a coercion would have been a
# rule with nowhere to be written down.

- name: a value goes in and comes back
  source: |
    src :: relation(n: i64, s: string, d: date)
    src(n:, s:, d:) <- input

    out(n: a, s: b, d: c) <-
        src(n: n, s: s, d: d)
        x := dynamic:of(n)
        x :: i64
        a := x
        y := dynamic:of(s)
        y :: string
        b := y
        z := dynamic:of(d)
        z :: date
        c := z

  input:
    - src:
        - [1, {n: 42, s: "x", d: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {n: 42, s: "x", d: "2024-01-15"}]

# The whole point of the type. A dynamic holding a date narrows to a `date` and
# to nothing else, where a document holding `"2024-01-15"` is text and narrows
# to a `string` — it cannot hold a date at all, which is the case below.
#
# The two rows here carry the same characters, and only the one that went in as
# text comes back out of `:: string`. That is what a tag buys.
- name: a dynamic knows what it is
  source: |
    src :: relation(d: date)
    src(d:) <- input
    txt :: relation(s: string)
    txt(s:) <- input

    out(v: v) <-
        src(d: d)
        x := dynamic:of(d)
        x :: string
        v := x

    out(v: v) <-
        txt(s: s)
        x := dynamic:of(s)
        x :: string
        v := x

  input:
    - src:
        - [1, {d: "2024-01-15"}]
      txt:
        - [1, {s: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {v: "2024-01-15"}]

- name: where a document cannot hold one at all
  source: |
    src :: relation(doc: json)
    src(doc:) <- input

    out(v: v) <-
        src(doc: doc)
        x := doc
        x :: date
        v := x
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "a document is not read as a `date`"

# A dynamic is a document when it holds one — the lenient reading, asked for on
# purpose. It is the one narrowing out of a dynamic that is about shape rather
# than about what the value is, and it stops where JSON does: a dynamic holding
# a date is not a document, because no document holds a date.
- name: a dynamic is a document when it holds one
  source: |
    src :: relation(n: i64)
    src(n:) <- input
    day :: relation(d: date)
    day(d:) <- input

    out(v: v) <-
        src(n: n)
        x := dynamic:of(n)
        x :: json
        v := x

    out(v: v) <-
        day(d: d)
        x := dynamic:of(d)
        x :: json
        v := x

  input:
    - src:
        - [1, {n: 42}]
      day:
        - [1, {d: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {v: 42}]

- name: a container goes in whole
  source: |
    src :: relation(a: array(i64))
    src(a:) <- input

    out(n: n) <-
        src(a: a)
        x := dynamic:of(a)
        x :: array(i64)
        n := array:length(x)

  input:
    - src:
        - [1, {a: [1, 2, 3]}]

  expected_exact_output:
    - out:
        - [1, {n: 3}]

# -- what it will not do ------------------------------------------------------

# A dynamic holds a value; `optional(dynamic)` is how a column says it might
# have none.
- name: absence is not a value a dynamic holds
  source: |
    src :: relation(v: optional(i64))
    src(v:) <- input

    out(d: d) <-
        src(v: v)
        d := dynamic:of(v)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of `dynamic:of` takes `optional(i64)`"

- name: nor is a dynamic itself
  source: |
    src :: relation(n: i64)
    src(n:) <- input

    out(d: d) <-
        src(n: n)
        x := dynamic:of(n)
        d := dynamic:of(x)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of `dynamic:of` takes `dynamic`"

# Not a scalar: comparison would sort by what a value *is* before what it holds,
# so every number would precede every string. Same rule a document follows.
- name: dynamics have no order
  source: |
    src :: relation(a: i64, b: i64)
    src(a:, b:) <- input

    out(v: v) <-
        src(a: a, b: b)
        v := dynamic:of(a) < dynamic:of(b)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "ordering is not defined on `dynamic`; compare its parts"

- name: but they compare for equality
  source: |
    src :: relation(a: i64, b: i64)
    src(a:, b:) <- input

    out(a: a, same: v) <-
        src(a: a, b: b)
        v := dynamic:of(a) = dynamic:of(b)

  input:
    - src:
        - [1, {a: 1, b: 1}]
        - [1, {a: 2, b: 9}]

  expected_exact_output:
    - out:
        - [1, {a: 1, same: true}]
        - [1, {a: 2, same: false}]
