# What defines a relation: facts, rules with no atom, and relations with no
# columns — `docs/grasp/semantics.md` and `docs/grasp/types.md`.

# ---------------------------------------------------------------------------
# Facts
# ---------------------------------------------------------------------------

- name: facts over every literal form
  source: |
    edge :: relation(src: i64, dst: i64)
    edge(src: 1, dst: 2)
    edge(src: 2, dst: 3)
  expected_ok: true

# "usually literals, but `1 + 1` and `length("abc")` are facts too."
- name: a fact argument may be any closed expression
  source: |
    sized :: relation(n: i64, m: i64)
    sized(n: 1 + 1, m: length("abc"))
  expected_ok: true

- name: a fact with a compound argument
  source: |
    conf :: relation(tags: array(string), meta: record(k: string))
    conf(tags: ["a", "b"], meta: record(k: "v"))
  expected_ok: true

- name: facts and rules may define one relation together
  source: |
    edge :: relation(src: i64, dst: i64)

    reachable(node: 1)
    reachable(node: n) <-
        reachable(node: m)
        edge(src: m, dst: n)
  expected_ok: true

# ---------------------------------------------------------------------------
# Rules with no positive atom
# ---------------------------------------------------------------------------
#
# Each of these declares its head, and the spec is not decoration: a body with
# no atom has nothing beside its literals to take a type from, so `6 * 7` is two
# untyped literals and the head column is the only thing that can settle them.
# `semantics.md` writes its own example this way and says why. Delete a spec
# here and the case stops being legal.

- name: a body of nothing but a match
  source: |
    answer :: relation(v: i64)

    answer(v: n) <-
        n := 6 * 7
  expected_ok: true

- name: the same rule on one line
  source: |
    answer :: relation(v: i64)

    answer(v: n) <- n := 6 * 7
  expected_ok: true

- name: several matches and no atom
  source: |
    origin :: relation(x: i64, y: i64, d: i64)

    origin(x: a, y: b, d: c) <-
        a := 0
        b := 0
        c := a + b
  expected_ok: true

- name: a match and a filter, and no atom
  source: |
    maybe :: relation(v: i64)

    maybe(v: n) <-
        n := 6 * 7
        n > 40
  expected_ok: true

# ---------------------------------------------------------------------------
# Relations with no columns
# ---------------------------------------------------------------------------

- name: a relation with no columns, specified and derived
  source: |
    config :: relation(mode: string)

    ready :: relation()
    ready() <-
        config(mode: "on")
  expected_ok: true

- name: a proposition asserted as a fact
  source: |
    ready :: relation()
    ready()
  expected_ok: true

# The main reason to have one: guarding a rule. The atom binds nothing, so it is
# its own component of the join graph and is crossed in.
- name: a proposition guards a rule
  source: |
    config :: relation(mode: string)
    account :: relation(id: i64)

    ready :: relation()
    ready() <-
        config(mode: "on")

    active(id: i) <-
        ready()
        account(id: i)
  expected_ok: true

- name: a negated proposition
  source: |
    config :: relation(mode: string)
    account :: relation(id: i64)

    paused :: relation()
    paused() <-
        config(mode: "off")

    active(id: i) <-
        account(id: i)
        not paused()
  expected_ok: true

# The filter is over string literals rather than integers on purpose: an
# integer literal takes its type from context, and two compared to each other
# have none — `inference.md` reports that rather than defaulting.
- name: a proposition derived with no atom at all
  source: |
    always :: relation()
    always() <-
        "x" = "x"
  expected_ok: true

# ---------------------------------------------------------------------------
# Rejections the specification states verbatim
# ---------------------------------------------------------------------------

# `types.md`: "A proposition cannot be declared `<- input`."
- name: a relation with no columns cannot be an input
  source: |
    ready :: relation()
    ready() <- input
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "has no columns and cannot be an input"

# `semantics.md`: a fact's arguments are closed, and the shorthand is not.
- name: a fact argument cannot be a variable
  source: |
    edge :: relation(src: i64, dst: i64)
    edge(src: x, dst: 2)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "nothing in the body binds it"

- name: the shorthand is not closed either
  source: |
    edge :: relation(src: i64, dst: i64)
    edge(src:, dst: 2)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "nothing in the body binds it"

# `semantics.md`: "A relation is defined by the program or comes from outside,
# not both."
- name: a relation may not have both facts and an input rule
  source: |
    edge :: relation(src: i64, dst: i64)
    edge(src:, dst:) <- input
    edge(src: 1, dst: 2)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "has both an input rule and facts"

# `inference.md` reports both of these in phase 2, and until now nothing
# asserted either — which is how 124 of 185 cases drifted into mentioning
# relations that exist nowhere. `tests/declared.rs` is the guard that stops it
# happening again while `infer` is still to come.

- name: a relation mentioned in a body must be declared
  source: |
    r(x: x) <-
        nowhere(x: x)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "is not defined and has no typespec"

# The dangerous spelling: an undefined relation under `not` matches nothing, so
# the rule silently admits every row rather than none. It fails open, which is
# why the rule has to cover negated atoms too.
- name: a negated atom must name a declared relation
  source: |
    account :: relation(id: i64)

    active(id: i) <-
        account(id: i)
        not nowhere(id: i)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "is not defined and has no typespec"

# The mirror image, and legal: a spec is a declaration on its own. The relation
# is empty for the life of the program, which is a fine thing for it to be.
- name: a relation with a typespec and no rules is declared
  source: |
    edge :: relation(src: i64, dst: i64)

    hop(dst: y) <-
        edge(src: 1, dst: y)
  expected_ok: true

# A recursive rule cannot type its own head, so a relation defined only by one
# has nothing to start from. This is the second of the two phase-2 diagnostics.
- name: a relation needs a non-recursive rule or a typespec
  source: |
    step :: relation(a: i64, b: i64)

    loop(n: n) <-
        loop(n: m)
        step(a: m, b: n)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "has no non-recursive rule and no typespec"

# A fact's arguments are closed, so an untyped literal in one has two possible
# sources and no others: the relation's spec, or another rule for the same
# relation. `inference.md` reports it rather than defaulting to `i64`, because a
# default would put a type nobody chose into a relation's schema.
- name: a fact literal with nothing to take a type from
  source: |
    edge(src: 1, dst: 2)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "has no type here"

- name: a string literal in a fact carries its own type
  source: |
    greeting(word: "hello")
  expected_ok: true
