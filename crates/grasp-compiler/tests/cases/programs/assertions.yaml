# `v :: T` — "a compile-time check where the value is already known to be a
# `T`, and a runtime filter where a check could settle it, dropping the rows
# that do not match and narrowing `v` to `T` for everything after it."
#
# The rule body is a set, so "after it" is wherever the filter lands, and it
# lands as early as the variable is bound. One type for the whole rule.

# "`optional(T) :: T` is the common one — the way to drop absent rows before a
#  join when you do not want absence to participate."
- name: an optional narrows by dropping the absent rows
  source: |
    person :: relation(name: optional(string))
    person(name:) <- input

    named :: relation(name: string)
    named(name: n) <-
        person(name: n)
        n :: string

  input:
    - person:
        - [1, {name: "ann"}]
        - [1, {name: null}]
        - [1, {name: "bo"}]

  expected_exact_output:
    - named:
        - [1, {name: "ann"}]
        - [1, {name: "bo"}]

# Narrowed, the variable is an ordinary definite value: it joins, and absence
# never had to participate.
- name: a narrowed variable joins
  source: |
    person :: relation(id: i64, name: optional(string))
    title :: relation(name: string, t: string)
    person(id:, name:) <- input
    title(name:, t:) <- input

    titled(id: i, t: t) <-
        person(id: i, name: n)
        n :: string
        title(name: n, t: t)

  input:
    - person:
        - [1, {id: 1, name: "ann"}]
        - [1, {id: 2, name: null}]
      title:
        - [1, {name: "ann", t: "dr"}]

  expected_exact_output:
    - titled:
        - [1, {id: 1, t: "dr"}]

# "`json :: T` — drops the row when the document does not hold a `T`." A
# document is converted by what is wanted, and that conversion is the test.
- name: a document narrows to what it holds
  source: |
    doc :: relation(k: string, d: json)
    doc(k:, d:) <- input

    num :: relation(k: string, v: i64)
    num(k: k, v: x) <-
        doc(k: k, d: x)
        x :: i64

  input:
    - doc:
        - [1, {k: "a", d: 7}]
        - [1, {k: "b", d: "not a number"}]

  expected_exact_output:
    - num:
        - [1, {k: "a", v: 7}]

# "It is a compile-time check where the value is already known to be a `T`" —
# so nothing is emitted, and every row survives.
- name: an assertion a value already satisfies drops nothing
  source: |
    r :: relation(a: i64)
    r(a:) <- input

    s(v: x) <-
        r(a: x)
        x :: i64

  input:
    - r:
        - [1, {a: 1}]
        - [1, {a: 2}]

  expected_exact_output:
    - s:
        - [1, {v: 1}]
        - [1, {v: 2}]

# "Where no check could help it is a compile error, because a filter that can
#  never pass is a silently empty relation."
- name: an assertion no value could satisfy is an error
  source: |
    r :: relation(a: i64)
    r(a:) <- input

    s(v: x) <-
        r(a: x)
        x :: string

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "this assertion would discard every row"

# "An assertion binds nothing — the variable must already exist."
- name: an assertion may not mention an unbound variable
  source: |
    r :: relation(a: i64)
    r(a:) <- input

    s(v: x) <-
        r(a: x)
        y :: i64

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "an assertion, which binds nothing"

# "`optional(A)` :: `optional(B)` — drops the row when present and not a `B`."
#
# The wrapper survives, and that is the whole case: a document holding a `7`
# converts, one holding a string is dropped, and an *absent* one comes through
# absent. A reading that only casts gets the third row wrong — `cast` maps
# absence and a failed extraction alike to `NONE` — which is why the filter
# reads the value on both sides of the conversion.
- name: a narrowing may keep its wrapper
  source: |
    doc :: relation(k: string, d: optional(json))
    doc(k:, d:) <- input

    num :: relation(k: string, v: optional(i64))
    num(k: k, v: x) <-
        doc(k: k, d: x)
        x :: optional(i64)

  input:
    - doc:
        - [1, {k: "a", d: 7}]
        - [1, {k: "b", d: "not a number"}]
        - [1, {k: "c", d: null}]

  expected_exact_output:
    - num:
        - [1, {k: "a", v: 7}]
        - [1, {k: "c", v: null}]

# And it is `optional(i64)` afterwards, not `i64`. A narrowing that quietly
# made the variable definite would pass the case above and be wrong the moment
# anything read the variable's type.
- name: and the variable keeps it too
  source: |
    doc :: relation(k: string, d: optional(json))
    doc(k:, d:) <- input

    num(k: k, v: x) <-
        doc(k: k, d: x)
        x :: optional(i64)
  expected_types:
    num:   {k: string, v: optional(i64)}
    num:0: {k: string, x: optional(i64)}

# Numbers do not widen, so there is no check that could settle this and it is
# the compile error, not a filter that never passes.
- name: a wrapper does not make an impossible narrowing possible
  source: |
    r :: relation(a: optional(i64))
    r(a:) <- input

    s(v: x) <-
        r(a: x)
        x :: optional(f64)

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "this assertion would discard every row"

# Each of the three "check under something" rows is written, and each admits
# only a whole-value check underneath. This is two of them composed — an
# optional over an array — which is a fifth emission shape nobody has wanted.
# It must stay pending rather than emit the one-level form, which would try to
# convert a whole `array(json)` and be rejected by grasp-dbsp.
- name: a narrowing under two wrappers
  source: |
    r :: relation(a: optional(array(json)))
    r(a:) <- input

    s :: relation(v: optional(array(i64)))
    s(v: x) <-
        r(a: x)
        x :: optional(array(i64))

  expected_ok: true

# "`array(A)` :: `array(B)` — drops the row when any element is not a `B`."
#
# `filter_array` counts the elements that would survive against the elements
# there are, which is the per-element test; `map_array` rebuilds the array. The
# row with a bad element is dropped whole — a narrowing is not a filter over the
# elements.
- name: narrowing inside an array drops the rows an element fails
  source: |
    r :: relation(k: string, a: array(json))
    r(k:, a:) <- input

    s :: relation(k: string, v: array(i64))
    s(k: k, v: x) <-
        r(k: k, a: x)
        x :: array(i64)

  input:
    - r:
        - [1, {k: "ok", a: [1, 2]}]
        - [1, {k: "no", a: [1, "two"]}]

  expected_exact_output:
    - s:
        - [1, {k: "ok", v: [1, 2]}]

# "`dict(K,A)` :: `dict(K,B)` — drops the row when any value is not a `B`."
# The same shape over `entries`, rebuilt with `dict`. The keys are untouched:
# only the values are converted, which is what the row says.
- name: narrowing inside a dict drops the rows a value fails
  source: |
    r :: relation(k: string, d: dict(string, json))
    r(k:, d:) <- input

    s :: relation(k: string, v: dict(string, i64))
    s(k: k, v: x) <-
        r(k: k, d: x)
        x :: dict(string, i64)

  input:
    - r:
        - [1, {k: "ok", d: {"a": 1, "b": 2}}]
        - [1, {k: "no", d: {"a": 1, "b": "two"}}]
        - [1, {k: "empty", d: {}}]

  expected_exact_output:
    - s:
        - [1, {k: "ok", v: {a: 1, b: 2}}]
        - [1, {k: "empty", v: {}}]

# An empty container passes: there is no element to fail, and the check counts
# survivors against elements rather than asking for at least one.
- name: an empty array narrows to an empty array
  source: |
    r :: relation(k: string, a: array(json))
    r(k:, a:) <- input

    s :: relation(k: string, v: array(i64))
    s(k: k, v: x) <-
        r(k: k, a: x)
        x :: array(i64)

  input:
    - r:
        - [1, {k: "e", a: []}]

  expected_exact_output:
    - s:
        - [1, {k: "e", v: []}]

# "`v` is narrowed to `T` for the rest of the rule" — and a rule body is a set,
# so "the rest" is the whole of it. Every statement sees the narrowed type,
# however the two were arranged.
#
# None of this worked until the assertions were read before the walk rather
# than applied after it: the head saw the narrowed type and no body statement
# did, so the common `optional(T) :: T` could not be followed by arithmetic on
# what it narrowed.
- name: a narrowed variable is an ordinary operand
  source: |
    p :: relation(a: optional(i64))
    p(a:) <- input
    out(v: n) <- 
        p(a: x)
        x :: i64
        n := x + 1
  input:
    - p:
        - [1, {a: 41}]
        - [1, {a: null}]
  expected_exact_output:
    - out:
        - [1, {v: 42}]

- name: an assertion may be written above what it narrows
  source: |
    p :: relation(a: optional(i64))
    p(a:) <- input
    out(v: n) <-
        x :: i64
        n := x + 1
        p(a: x)
  equivalent_to: |
    p :: relation(a: optional(i64))
    p(a:) <- input
    out(v: n) <-
        p(a: x)
        n := x + 1
        x :: i64

- name: a narrowed document may be unnested
  source: |
    doc :: relation(d: json)
    doc(d:) <- input
    out(v: v) <-
        doc(d: x)
        x :: array(i64)
        (v) := *x
  input:
    - doc:
        - [1, {d: [1, 2]}]
        - [1, {d: "no"}]
  expected_exact_output:
    - out:
        - [1, {v: 1}]
        - [1, {v: 2}]

- name: two assertions that agree are one claim
  source: |
    p :: relation(a: optional(i64))
    p(a:) <- input
    out(v: x) <-
        p(a: x)
        x :: i64
        x :: i64
  expected_ok: true

- name: two assertions that disagree are a mistake
  source: |
    p :: relation(a: json)
    p(a:) <- input
    out(v: x) <-
        p(a: x)
        x :: i64
        x :: string
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "asserted as"
