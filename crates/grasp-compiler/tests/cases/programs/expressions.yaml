# Expressions in a rule body — what they compute, and where they have no answer.
#
# Division is the interesting one: it yields a plain numeric type, and a row
# whose divisor is zero is not derived rather than carrying an absence.

# Division has no answer for a zero divisor, so those rows are not derived —
# `q` is an ordinary `i64` and nothing downstream sees an absence.
- name: a zero divisor derives no row
  source: |
    pair :: relation(a: i64, b: i64)
    pair(a:, b:) <- input

    ratio(a: a, q: q) <-
        pair(a: a, b: b)
        q := a / b

  input:
    - pair:
        - [1, {a: 10, b: 2}]
        - [1, {a: 9, b: 3}]
        - [1, {a: 7, b: 0}]

  expected_exact_output:
    - ratio:
        - [1, {a: 10, q: 5}]
        - [1, {a: 9, q: 3}]

- name: a division result is an ordinary operand
  source: |
    pair :: relation(a: i64, b: i64)
    pair(a:, b:) <- input

    scaled(v: n) <-
        pair(a: a, b: b)
        n := a / b + a % b
  expected_ok: true

# `inference.md`: "`e` is not a record, so it has no field `f`".
- name: a field read on a value that is not a record
  source: |
    s :: relation(j: i64)

    q(v: v) <-
        s(j: j)
        v := j.a
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "`i64` is not a record, so it has no field `a`"
      line: 5
