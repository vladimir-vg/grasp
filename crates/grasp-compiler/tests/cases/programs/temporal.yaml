# `date`, `time` and `timestamp`, and the `temporal:` library.
#
# The three are **scalars**, which in grasp gates four things at once: ordering,
# `min`/`max`, keying a dict, and `dict:from_entries`. All four are wanted, and
# none of them needed a rule of its own.
#
# They are not numeric, so `+` on them is the error it already was. A difference
# is a named function that says its unit, because the answer to "how far apart"
# is an `interval` and grasp does not have one yet.

- name: a date orders, and a rule may filter on it
  source: |
    sale :: relation(d: date, amount: i64)
    sale(d:, amount:) <- input

    recent(amount: a) <-
        sale(d: d, amount: a)
        cutoff := temporal:date(year: 2024, month: 1, day: 1)
        d > cutoff

  input:
    - sale:
        - [1, {d: "2023-06-01", amount: 10}]
        - [1, {d: "2024-06-01", amount: 20}]

  expected_exact_output:
    - recent:
        - [1, {amount: 20}]

- name: a date groups, which is what makes it a scalar
  source: |
    sale :: relation(d: date, amount: i64)
    sale(d:, amount:) <- input

    daily(d: d, total: sum<a>) <-
        sale(d: d, amount: a)

  input:
    - sale:
        - [1, {d: "2024-01-01", amount: 10}]
        - [1, {d: "2024-01-01", amount: 20}]
        - [1, {d: "2024-01-02", amount: 5}]

  expected_exact_output:
    - daily:
        - [1, {d: "2024-01-01", total: 30}]
        - [1, {d: "2024-01-02", total: 5}]

# -- one name, two types ------------------------------------------------------
#
# `temporal:date` parses a `string` and extracts from a `timestamp`. Both are
# shape `(_)`, so the shape cannot choose and the **argument's type** does.

- name: temporal:date parses a string
  source: |
    src :: relation(s: string)
    src(s:) <- input

    out(d: d) <-
        src(s: s)
        d := temporal:date(s)

  input:
    - src:
        - [1, {s: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15"}]

# Parsing is partial, so a string that is not a date derives no row — the rule
# `dict:get` follows.
- name: and derives no row for text that is not one
  source: |
    src :: relation(s: string)
    src(s:) <- input

    out(d: d) <-
        src(s: s)
        d := temporal:date(s)

  input:
    - src:
        - [1, {s: "the fifteenth"}]

  expected_exact_output:
    - {}

- name: temporal:date extracts from a timestamp
  source: |
    src :: relation(ts: timestamp)
    src(ts:) <- input

    out(d: d, t: t) <-
        src(ts: ts)
        d := temporal:date(ts)
        t := temporal:time(ts)

  input:
    - src:
        - [1, {ts: "2024-01-15 14:30:05"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15", t: "14:30:05"}]

# Extraction always has an answer, so unlike parsing it drops nothing — which is
# why the two are separate functions under one name rather than one that is
# sometimes partial.
- name: extraction drops no row
  source: |
    src :: relation(ts: timestamp)
    src(ts:) <- input

    out(y: y) <-
        src(ts: ts)
        y := temporal:years(ts)

  input:
    - src:
        - [1, {ts: "2024-01-15 14:30:05"}]
        - [1, {ts: "1999-12-31 23:59:59"}]

  expected_exact_output:
    - out:
        - [1, {y: 2024}]
        - [1, {y: 1999}]

- name: a shape no version takes is reported against the call
  source: |
    src :: relation(n: i64)
    src(n:) <- input

    out(d: d) <-
        src(n: n)
        d := temporal:date(n)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of `temporal:date` takes `i64`"

# -- construction -------------------------------------------------------------

- name: components make a date, and a bad one derives no row
  source: |
    src :: relation(y: i64, m: i64, d: i64)
    src(y:, m:, d:) <- input

    out(v: v) <-
        src(y: y, m: m, d: d)
        v := temporal:date(year: y, month: m, day: d)

  input:
    - src:
        - [1, {y: 2024, m: 2, d: 29}]
        - [1, {y: 2023, m: 2, d: 29}]

  expected_exact_output:
    - out:
        - [1, {v: "2024-02-29"}]

# `second:` and `microsecond:` default to zero, so four shapes call one
# function — the mechanism `array:slice` already uses.
- name: a time takes its trailing components or leaves them
  source: |
    src :: relation(h: i64, m: i64)
    src(h:, m:) <- input

    out(a: a, b: b, c: c) <-
        src(h: h, m: m)
        a := temporal:time(hour: h, minute: m)
        b := temporal:time(hour: h, minute: m, second: 5)
        c := temporal:time(hour: h, minute: m, second: 5, microsecond: 123456)

  input:
    - src:
        - [1, {h: 14, m: 30}]

  expected_exact_output:
    - out:
        - [1, {a: "14:30:00", b: "14:30:05", c: "14:30:05.123456"}]

- name: a date and a time make an instant
  source: |
    src :: relation(d: date, t: time)
    src(d:, t:) <- input

    out(ts: ts, back: n) <-
        src(d: d, t: t)
        ts := temporal:timestamp(date: d, time: t)
        n := temporal:epoch_micros(ts)

  input:
    - src:
        - [1, {d: "1970-01-01", t: "00:00:01"}]

  expected_exact_output:
    - out:
        - [1, {ts: "1970-01-01 00:00:01", back: 1000000}]

- name: an instant from the epoch
  source: |
    src :: relation(n: i64)
    src(n:) <- input

    out(ts: ts) <-
        src(n: n)
        ts := temporal:timestamp(epoch_microseconds: n)

  input:
    - src:
        - [1, {n: 0}]

  expected_exact_output:
    - out:
        - [1, {ts: "1970-01-01 00:00:00"}]

# -- components and differences -----------------------------------------------

# A component reads either type that holds it, so an instant needs no conversion
# written around it — the same shape `length` has over string, array and dict.
- name: an instant yields its components directly
  source: |
    src :: relation(ts: timestamp)
    src(ts:) <- input

    out(y: y, mo: mo, dy: dy, h: h, mi: mi, s: s) <-
        src(ts: ts)
        y := temporal:years(ts)
        mo := temporal:months(ts)
        dy := temporal:days(ts)
        h := temporal:hours(ts)
        mi := temporal:minutes(ts)
        s := temporal:seconds(ts)

  input:
    - src:
        - [1, {ts: "2024-02-29 14:30:05"}]

  expected_exact_output:
    - out:
        - [1, {y: 2024, mo: 2, dy: 29, h: 14, mi: 30, s: 5}]

- name: but not a type that does not hold the component
  source: |
    src :: relation(d: date)
    src(d:) <- input

    out(v: v) <-
        src(d: d)
        v := temporal:hours(d)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of `temporal:hours` takes `date`"

- name: every component of a date and a time
  source: |
    src :: relation(d: date, t: time)
    src(d:, t:) <- input

    out(y: y, mo: mo, dy: dy, h: h, mi: mi, s: s, us: us) <-
        src(d: d, t: t)
        y := temporal:years(d)
        mo := temporal:months(d)
        dy := temporal:days(d)
        h := temporal:hours(t)
        mi := temporal:minutes(t)
        s := temporal:seconds(t)
        us := temporal:microseconds(t)

  input:
    - src:
        - [1, {d: "2024-02-29", t: "14:30:05.123456"}]

  expected_exact_output:
    - out:
        - [1, {y: 2024, mo: 2, dy: 29, h: 14, mi: 30, s: 5, us: 123456}]

# -- interval -----------------------------------------------------------------
#
# A span of time, in microseconds. It is a **scalar** — one integer, so it
# orders, `min` folds it, and it keys a dict — which a type carrying months
# beside them could not have been, 1 month against 31 days having no answer.

- name: a difference between two of a kind is a span
  source: |
    src :: relation(a: date, b: date, x: timestamp, y: timestamp)
    src(a:, b:, x:, y:) <- input

    out(days: d, micros: m) <-
        src(a: a, b: b, x: x, y: y)
        d := temporal:total_days(a - b)
        m := temporal:total_microseconds(x - y)

  input:
    - src:
        - [1, {a: "2024-03-01", b: "2024-02-01", x: "2024-01-01 00:00:01", y: "2024-01-01 00:00:00"}]

  expected_exact_output:
    - out:
        - [1, {days: 29, micros: 1000000}]

- name: an instant shifts by a span
  source: |
    src :: relation(ts: timestamp)
    src(ts:) <- input

    out(later: l, earlier: e) <-
        src(ts: ts)
        iv := temporal:interval(hours: 1, minutes: 30)
        l := ts + iv
        e := ts - iv

  input:
    - src:
        - [1, {ts: "2024-01-15 12:00:00"}]

  expected_exact_output:
    - out:
        - [1, {later: "2024-01-15 13:30:00", earlier: "2024-01-15 10:30:00"}]

# Every unit converts exactly, so two spellings of one span are one value.
- name: a day and twenty-four hours are one span
  source: |
    src :: relation(x: i64)
    src(x:) <- input

    out(same: s) <-
        src(x: x)
        s := temporal:interval(days: 1) = temporal:interval(hours: 24)

  input:
    - src:
        - [1, {x: 1}]

  expected_exact_output:
    - out:
        - [1, {same: true}]

# A date has no sub-day resolution, so a shift truncates toward zero. Total —
# the row is always derived — and the one lossy rule here.
- name: a date shifts by whole days, truncating
  source: |
    src :: relation(d: date)
    src(d:) <- input

    out(a: a, b: b, c: c) <-
        src(d: d)
        a := d + temporal:interval(days: 1)
        b := d + temporal:interval(hours: 30)
        c := d + temporal:interval(hours: 1)

  input:
    - src:
        - [1, {d: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {a: "2024-01-16", b: "2024-01-16", c: "2024-01-15"}]

# The two costs of that being total, as fixtures rather than prose: it is not
# invertible, and not associative over addition.
- name: truncation is neither invertible nor associative
  source: |
    src :: relation(d: date)
    src(d:) <- input

    out(round_trip: r, twice: t, once: o) <-
        src(d: d)
        half := temporal:interval(hours: 12)
        r := (d + half) - half
        t := (d + half) + half
        o := d + temporal:interval(days: 1)

  input:
    - src:
        - [1, {d: "2024-01-15"}]

  expected_exact_output:
    - out:
        - [1, {round_trip: "2024-01-15", twice: "2024-01-15", once: "2024-01-16"}]

- name: a time wraps at midnight
  source: |
    src :: relation(t: time)
    src(t:) <- input

    out(later: l) <-
        src(t: t)
        l := t + temporal:interval(hours: 1)

  input:
    - src:
        - [1, {t: "23:30:00"}]

  expected_exact_output:
    - out:
        - [1, {later: "00:30:00"}]

- name: a span orders, so it groups and folds
  source: |
    src :: relation(k: i64, a: timestamp, b: timestamp)
    src(k:, a:, b:) <- input

    gaps(k: k, shortest: min<g>) <-
        src(k: k, a: a, b: b)
        g := a - b

  input:
    - src:
        - [1, {k: 1, a: "2024-01-01 02:00:00", b: "2024-01-01 00:00:00"}]
        - [1, {k: 1, a: "2024-01-01 00:30:00", b: "2024-01-01 00:00:00"}]

  expected_exact_output:
    - gaps:
        - [1, {k: 1, shortest: "PT30M"}]

- name: a duration less a moment is nothing
  source: |
    src :: relation(ts: timestamp)
    src(ts:) <- input

    out(v: v) <-
        src(ts: ts)
        v := temporal:interval(hours: 1) - ts
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of `-` takes `interval` and `timestamp`"

# -- narrowing ----------------------------------------------------------------
#
# A document holds a temporal value as a string, so `d :: date` is the `json ::
# T` row applied to a new `T` — the same codec, reached from the other side.

- name: a document narrows to a date
  source: |
    src :: relation(doc: json)
    src(doc:) <- input

    out(d: d) <-
        src(doc: doc)
        d := doc
        d :: date

  input:
    - src:
        - [1, {doc: "2024-01-15"}]
        - [1, {doc: "not a date"}]

  expected_exact_output:
    - out:
        - [1, {d: "2024-01-15"}]

# Temporal types are not numeric, so this is the error it already was for a
# string — no new rule, which is the point of them not being numbers.
- name: there is no arithmetic on them
  source: |
    src :: relation(d: date)
    src(d:) <- input

    out(v: v) <-
        src(d: d)
        v := d + 1
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of `+` takes `date` and `an integer literal`"
