# Aggregation. "Grouping is implicit: the group is the head's non-aggregate
# columns. This is what makes aggregation read like the rest of the language:
# there is no `group by`, because the head already says what the result is
# keyed by."

- name: sum groups by the head's other columns
  source: |
    emp :: relation(dept: string, sal: i64)
    emp(dept:, sal:) <- input

    payroll(dept: d, total: s) <-
        emp(dept: d, sal: r)
        s := sum<r>

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
        - [1, {dept: "eng", sal: 200}]
        - [1, {dept: "ops", sal: 50}]

  expected_exact_output:
    - payroll:
        - [1, {dept: "eng", total: 300}]
        - [1, {dept: "ops", total: 50}]

# A head with no column besides the aggregate groups by nothing: one row for
# the whole relation.
- name: an aggregate with no other head column groups by nothing
  source: |
    emp :: relation(dept: string, sal: i64)
    emp(dept:, sal:) <- input

    total :: relation(all: i64)
    total(all: s) <-
        emp(dept: d, sal: r)
        s := sum<r>

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
        - [1, {dept: "ops", sal: 50}]

  expected_exact_output:
    - total:
        - [1, {all: 150}]

- name: several aggregates share one group
  source: |
    emp :: relation(dept: string, sal: i64)
    emp(dept:, sal:) <- input

    span(dept: d, lo: a, hi: b, n: c) <-
        emp(dept: d, sal: r)
        a := min<r>
        b := max<r>
        c := count<>

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
        - [1, {dept: "eng", sal: 200}]
        - [1, {dept: "ops", sal: 7}]

  expected_exact_output:
    - span:
        - [1, {dept: "eng", lo: 100, hi: 200, n: 2}]
        - [1, {dept: "ops", lo: 7, hi: 7, n: 1}]

# "The argument may be an expression: `sum<p * q>` aggregates the product."
- name: an aggregate over an expression
  source: |
    line :: relation(order: string, price: i64, qty: i64)
    line(order:, price:, qty:) <- input

    billed(order: o, total: t) <-
        line(order: o, price: p, qty: q)
        t := sum<p * q>

  input:
    - line:
        - [1, {order: "a", price: 3, qty: 4}]
        - [1, {order: "a", price: 5, qty: 2}]

  expected_exact_output:
    - billed:
        - [1, {order: "a", total: 22}]

# "`avg` yields `f64` whatever it was given, since a mean is not an integer."
# grasp-dbsp's yields `optional(f64)`, a mean of nothing being undefined, so
# this is the one aggregator whose result has to be narrowed on the way out.
- name: avg yields f64 over integers
  source: |
    emp :: relation(dept: string, sal: i64)
    emp(dept:, sal:) <- input

    mean :: relation(dept: string, m: f64)
    mean(dept: d, m: a) <-
        emp(dept: d, sal: r)
        a := avg<r>

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
        - [1, {dept: "eng", sal: 101}]

  expected_exact_output:
    - mean:
        - [1, {dept: "eng", m: 100.5}]

# "An empty group produces no row. A group exists because some row is in it;
#  there is no set of keys to produce zeros against."
- name: an empty group produces no row
  source: |
    emp :: relation(dept: string, sal: i64)
    dept :: relation(name: string)
    emp(dept:, sal:) <- input
    dept(name:) <- input

    payroll(dept: d, total: s) <-
        emp(dept: d, sal: r)
        s := sum<r>

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
      dept:
        - [1, {name: "eng"}]
        - [1, {name: "empty"}]

  expected_exact_output:
    - payroll:
        - [1, {dept: "eng", total: 100}]

# A filter over an aggregate's result cannot be placed until the aggregate has
# run, which is the one thing that comes after it.
- name: a filter may read an aggregate result
  source: |
    emp :: relation(dept: string, sal: i64)
    emp(dept:, sal:) <- input

    big(dept: d) <-
        emp(dept: d, sal: r)
        s := sum<r>
        s > 150

  input:
    - emp:
        - [1, {dept: "eng", sal: 100}]
        - [1, {dept: "eng", sal: 200}]
        - [1, {dept: "ops", sal: 50}]

  expected_exact_output:
    - big:
        - [1, {dept: "eng"}]

# Aggregation is stratified on the same terms as negation: the aggregated
# relation must be in a strictly lower stratum. "An aggregate over a relation
# still being computed would read a partial value, and which partial value
# would depend on evaluation order."
- name: an aggregate may not read its own recursive component
  source: |
    e :: relation(a: i64, b: i64)
    e(a:, b:) <- input

    p :: relation(v: i64, n: i64)
    p(v: x, n: 0) <- e(a: x, b: 0)
    p(v: x, n: c) <-
        p(v: x, n: m)
        c := sum<m>

  expected_diagnostics:
    - severity: error
      pass: plan
      message: "is in the same recursive component as this rule"

# And the case that must not be rejected: aggregating a strictly lower stratum
# from inside a recursive component is what stratification exists to allow.
- name: a recursive component may aggregate a lower stratum
  source: |
    edge :: relation(src: i64, dst: i64)
    weight :: relation(node: i64, w: i64)
    edge(src:, dst:) <- input
    weight(node:, w:) <- input

    heavy :: relation(node: i64, total: i64)
    heavy(node: n, total: t) <-
        weight(node: n, w: w)
        t := sum<w>

    reach(v: y) <-
        heavy(node: y, total: t)
        t > 5
    reach(v: y) <-
        reach(v: x)
        edge(src: x, dst: y)

  input:
    - weight:
        - [1, {node: 1, w: 10}]
        - [1, {node: 2, w: 1}]
      edge:
        - [1, {src: 1, dst: 2}]

  expected_exact_output:
    - reach:
        - [1, {v: 1}]
        - [1, {v: 2}]

# What an aggregator will and will not fold.
#
# None of this was checked. `sum<>` quietly folded a literal and gave every
# group 0; `count<e>` quietly meant grasp-dbsp's count — the values that are
# present — rather than the assignments in the group; and `sum<name>` over a
# string reached the target, which rejected it with a diagnostic against
# generated code. `min` over a record was rejected by neither, and invented
# exactly the ordering `types.md` says the language refuses to invent.

- name: count takes no argument
  source: |
    t :: relation(g: string, x: i64)
    t(g:, x:) <- input

    q(g: g, n: c) <-
        t(g: g, x: x)
        c := count<x>

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "`count` takes no argument"

- name: an aggregator other than count needs one
  source: |
    t :: relation(g: string, x: i64)
    t(g:, x:) <- input

    q(g: g, n: s) <-
        t(g: g, x: x)
        s := sum<>

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "`sum` needs an argument"

- name: sum needs a numeric argument
  source: |
    t :: relation(g: string, name: string)
    t(g:, name:) <- input

    q(g: g, s: s) <-
        t(g: g, name: n)
        s := sum<n>

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "`sum` needs a numeric argument, found `string`"

- name: avg needs a numeric argument
  source: |
    t :: relation(g: string, name: string)
    t(g:, name:) <- input

    q(g: g, m: m) <-
        t(g: g, name: n)
        m := avg<n>

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "`avg` needs a numeric argument"

# The same rule `<` enforces. A document sorts by type tag, and a record has no
# ordering at all — "any invention would be arbitrary in a way that silently
# decides `min` and `max`".
- name: min has no meaning over a document
  source: |
    d :: relation(g: string, doc: json)
    d(g:, doc:) <- input

    q(g: g, m: m) <-
        d(g: g, doc: doc)
        m := min<doc>

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "ordering is not defined on `json`, so `min` has no meaning over it"

- name: max has no meaning over a record
  source: |
    p :: relation(g: string, r: record(a: i64))
    p(g:, r:) <- input

    q(g: g, m: m) <-
        p(g: g, r: r)
        m := max<r>

  expected_diagnostics:
    - severity: error
      pass: infer
      message: "so `max` has no meaning over it"

# An `optional` is looked through: absence is skipped rather than folded, and
# the wrapper survives into the result. Both of these must keep working.
- name: sum folds an optional and keeps the wrapper
  source: |
    t :: relation(g: string, x: optional(i64))
    t(g:, x:) <- input

    q :: relation(g: string, s: optional(i64))
    q(g: g, s: s) <-
        t(g: g, x: x)
        s := sum<x>

  input:
    - t:
        - [1, {g: "a", x: 1}]
        - [1, {g: "a", x: 2}]

  expected_exact_output:
    - q:
        - [1, {g: "a", s: 3}]

- name: min folds an optional string
  source: |
    t :: relation(g: string, x: optional(string))
    t(g:, x:) <- input

    q :: relation(g: string, m: optional(string))
    q(g: g, m: m) <-
        t(g: g, x: x)
        m := min<x>

  input:
    - t:
        - [1, {g: "a", x: "b"}]
        - [1, {g: "a", x: "c"}]

  expected_exact_output:
    - q:
        - [1, {g: "a", m: "b"}]
