- name: an unbound variable as an unnest's source
  source: |
    src :: relation(i: i64)

    out(v: d) <-
        src(i: i)
        (d) := *xs
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `xs` appears in a match but nothing in the body binds it"

- name: an unbound variable as a destructure's source
  source: |
    src :: relation(i: i64)

    out(v: d) <-
        src(i: i)
        [d] := xs
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `xs` appears in a match but nothing in the body binds it"

# An expression in an atom's argument constrains the column; it binds nothing,
# so what it reads must be bound elsewhere.
- name: an unbound variable in an atom's expression argument
  source: |
    src :: relation(i: i64)

    out(v: k) <-
        src(i: k)
        src(i: j + 1)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `j` appears in an atom's argument but nothing in the body binds it"
