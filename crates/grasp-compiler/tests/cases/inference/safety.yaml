# Safety — `docs/grasp/semantics.md`, "Safety".
#
# A rule is safe when every variable it uses is bound by a positive atom or a
# match. These are the rejections that follow, and both are also facts about the
# grammar: each program parses, and is then turned down for what it means.

# The grammar accepts a bare filter as a body, and safety then rejects this one:
# `x` is used by the head and bound by nothing. Asserting the rejection says both
# halves at once — and keeps the case from passing today for the right reason and
# failing later for the wrong one.
- name: a single-line rule with a filter body, which safety then rejects
  source: |
    big(v: x) <- x > 3
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "nothing in the body binds it"

# `filter ::= expr -- must be boolean`. A bare call is grammatical — it is a
# filter whose expression is not boolean — so the rejection belongs to `infer`,
# not here. The message is deliberately not pinned: `inference.md` does not name
# one yet, and `pass` plus `line` are enough to keep a typo in this source from
# satisfying the case.
- name: a bare call is a filter, and must be boolean
  source: |
    s :: relation(x: string)

    r(x: x) <-
        s(x: x)
        string:length(x)
  expected_diagnostics:
    - severity: error
      pass: infer
      line: 5

# Where an unbound variable can hide. A rule body is a set, so "used" has to mean
# every position an expression can occupy — and one a walk did not reach once
# let an unbound name through to `plan`, which emitted a program reading a
# column nothing had bound. One case per position, each pinned to the safety
# message rather than to whatever typing would have said about an unknown type.
- name: an unbound variable in a slice bound
  source: |
    src :: relation(a: array(i64), lo: i64)

    out(v: v) <-
        src(a: a, lo: lo)
        v := a[lo:hi]
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `hi` appears in a match but nothing in the body binds it"
      line: 5

- name: an unbound variable in a call argument
  source: |
    src :: relation(i: i64)

    out(v: d) <-
        src(i: i)
        d := integer:abs(j)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `j` appears in a match but nothing in the body binds it"
      line: 5

- name: an unbound variable in an array literal
  source: |
    src :: relation(i: i64)

    out(v: d) <-
        src(i: i)
        d := [i, j]
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `j` appears in a match but nothing in the body binds it"

- name: an unbound variable as a subscript key
  source: |
    src :: relation(a: array(i64))

    out(v: v) <-
        src(a: a)
        v := a[i]
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `i` appears in a match but nothing in the body binds it"

- name: an unbound variable as a subscript subject
  source: |
    src :: relation(i: i64)

    out(v: v) <-
        src(i: i)
        v := a[i]
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "variable `a` appears in a match but nothing in the body binds it"

- name: an unbound variable under a field access
  source: |
    src :: relation(i: i64)

    out(v: v) <-
