# Assignability — `docs/grasp/types.md`.
#
# What a value of one type may be used as, and what the compiler says when it
# may not.

# The counterpart to the rejection above, and the one group pair where
# parenthesising is not enough: `++` takes strings and `+` takes numbers, and
# grasp has no implicit conversion, so there is no program that mixes them.
# Parentheses settle how it parses; the types then reject it anyway. Both facts
# are worth having, which is why this case asserts the second rather than
# pretending the first is the whole story.
- name: parenthesised, concatenation and arithmetic still do not typecheck
  source: |
    s :: relation(a: string, b: i64, c: i64)

    r(v: n) <-
        s(a: a, b: b, c: c)
        n := a ++ (b + c)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "no version of"

# "A spec never *overrides* what a rule infers — it constrains it. A rule
# producing `string` for a column declared `i64` is rejected, not coerced." A
# head that names a variable reports the variable; a head that computes reports
# the rule.
- name: a computed head argument against a declared column
  source: |
    a :: relation(v: i64)
    a(v:) <- input
    q :: relation(v: string)

    q(v: v + 1) <- a(v: v)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "this rule gives `q.v` type `i64`, but it is declared `string`"
      line: 5

# A literal in a head has a context — the declared column — and simply cannot
# inhabit it. That is what it is told, rather than that it has no type.
- name: a literal head argument against a declared column
  source: |
    a :: relation(v: i64)
    a(v:) <- input
    q :: relation(v: string)

    q(v: 1) <- a(v: v)
  expected_diagnostics:
    - severity: error
      pass: infer
      message: "this rule gives `q.v` type `an integer literal`, but it is declared `string`"
      line: 5
