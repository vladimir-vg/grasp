# Files that are not configurations, and what they are told.

- name: a misspelled key is not silently ignored
  config: |
    worker: 4
  expected_diagnostics:
    - "unknown field `worker`"

- name: an input connector needs a transport
  config: |
    inputs:
      orders:
        stream: orders
  expected_diagnostics:
    - "missing field `transport`"

- name: an output connector section says why there is nothing to configure
  config: |
    outputs:
      orders: {}
  expected_diagnostics:
    - "there is nothing for an output connector configuration to configure"

- name: a transport other than Kafka is refused
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: file_input
          config: {path: /tmp/orders.json}
  expected_diagnostics:
    - "input `orders`: `transport.name: file_input` is not a transport this server has"

- name: a format other than json is refused
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092", topic: orders}
        format:
          name: csv
  expected_diagnostics:
    - "`format.name: csv` is not implemented"

- name: an update format the decoder lacks is refused
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092", topic: orders}
        format:
          name: json
          config: {update_format: debezium}
  expected_diagnostics:
    - "`update_format: debezium` is not implemented"

- name: a Kafka input without a topic is refused
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092"}
  expected_diagnostics:
    - "input `orders`: the Kafka settings"

- name: Kafka metadata switches say the program declares its columns instead
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: kafka_input
          config:
            bootstrap.servers: "localhost:9092"
            topic: orders
            include_offset: true
            include_partition: true
  expected_diagnostics:
    - "`include_offset` puts Kafka metadata"
    - "`include_partition` puts Kafka metadata"

- name: a consumer group setting is refused rather than passed to librdkafka
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: kafka_input
          config:
            bootstrap.servers: "localhost:9092"
            topic: orders
            group.id: shop
  expected_diagnostics:
    - "`group.id` would hand the read position to Kafka"

- name: a Feldera connector key this server lacks is refused by name
  config: |
    inputs:
      orders:
        stream: orders
        max_batch_size: 100
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092", topic: orders}
  expected_diagnostics:
    - "input `orders`: `max_batch_size` caps how many records"

- name: an input feeding no table of the program names the tables it has
  program: |
    t := input("t")
    t :: zset(record(v: i64))
  config: |
    inputs:
      orders:
        stream: orders
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092", topic: orders}
  expected_diagnostics:
    - "input `orders` feeds `orders`, which is not a table of this program. Its tables are: t."

- name: two inputs feeding one table are refused
  program: |
    t := input("t")
    t :: zset(record(v: i64))
  config: |
    inputs:
      a:
        stream: t
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092", topic: a}
      b:
        stream: t
        transport:
          name: kafka_input
          config: {bootstrap.servers: "localhost:9092", topic: b}
  expected_diagnostics:
    - "inputs `a` and `b` both feed `t`"

- name: fault tolerance is refused because there is no input to replay
  config: |
    fault_tolerance:
      model: exactly_once
  expected_diagnostics:
    - "nothing to replay"

- name: a multihost layout is refused rather than ignored
  config: |
    hosts: 4
  expected_diagnostics:
    - "multi-host"

- name: a clock setting says this language has none
  config: |
    clock_resolution_usecs: 1000000
  expected_diagnostics:
    - "has no clock"

- name: every unsupported key is reported, not just the first
  config: |
    hosts: 4
    outputs: {}
  expected_diagnostics:
    - "`hosts` is a multi-host"
    - "`outputs` configures Feldera output connectors"

- name: storage with nowhere to write is refused
  config: |
    storage:
      min_storage_bytes: 0
  expected_diagnostics:
    - "this file has the first and not the second"

- name: a directory nothing would be written to is refused
  config: |
    storage_config:
      path: /tmp/grasp-dbsp-server-fixture-b
  expected_diagnostics:
    - "nothing would ever be written to it"

- name: zero workers is refused rather than clamped
  config: |
    workers: 0
  expected_diagnostics:
    - "at least one worker thread"

- name: a materialized view the program does not have names the ones it does
  program: |
    t := input("t")
    t :: zset(record(v: i64))
    out := distinct(t)
  config: |
    materialized: [revenue]
  expected_diagnostics:
    - "`materialized` names `revenue`, which is not a view of this program. Its views are: out, t."
