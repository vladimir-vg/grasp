# aggregate with min and max. Note `aggregate` takes a projection function:
# `Stream::aggregate` folds over the value, so the value is re-projected first.

- name: max salary per department
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, fun((r) -> (r.dept_id, r)))
    by_dept := aggregate(idx, max, fun((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 100}]
        - [1, {id: 2, dept_id: 10, salary: 200}]
        - [1, {id: 3, dept_id: 20, salary: 70}]

  expected_exact_output:
    - by_dept:
        - [1, 10, 200]
        - [1, 20, 70]

- name: min over the same grouping
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(dept_id: i64, salary: i64))
    idx := map_index(emp, fun((r) -> (r.dept_id, r)))
    lowest := aggregate(idx, min, fun((v) -> v.salary))

  input:
    - emp:
        - [1, {dept_id: 10, salary: 100}]
        - [1, {dept_id: 10, salary: 200}]

  expected_exact_output:
    - lowest:
        - [1, 10, 100]

- name: retracting the maximum moves the aggregate down
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, fun((r) -> (r.dept_id, r)))
    by_dept := aggregate(idx, max, fun((v) -> v.salary))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 150}]
        - [1, {id: 2, dept_id: 10, salary: 90}]
    - emp:
        - [-1, {id: 1, dept_id: 10, salary: 150}]

  expected_exact_output:
    - by_dept:
        - [1, 10, 150]
    - by_dept:
        - [-1, 10, 150]
        - [1, 10, 90]

- name: removing the last row of a group retracts the group
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(dept_id: i64, salary: i64))
    idx := map_index(emp, fun((r) -> (r.dept_id, r)))
    by_dept := aggregate(idx, max, fun((v) -> v.salary))

  input:
    - emp:
        - [1, {dept_id: 10, salary: 100}]
    - emp:
        - [-1, {dept_id: 10, salary: 100}]

  expected_exact_output:
    - by_dept:
        - [1, 10, 100]
    - by_dept:
        - [-1, 10, 100]
