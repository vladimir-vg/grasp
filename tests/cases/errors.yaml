# Compilation failures. Only the fields a case writes are checked, so a fixture
# can pin a message without committing to a column, or pin a column once the
# span is known to be right.
#
# Each case names a `pass` and a `message` specific enough that a typo in the
# fixture's own source — which would also fail to compile — cannot satisfy it.

- name: unknown field
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := filter(a, fun((r) -> r.nope > 1))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "has no field `nope`"
      line: 3
      column: 27

- name: unknown parameter
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := filter(a, fun((r) -> q.id > 1))

  expected_diagnostics:
    - pass: typecheck
      message: "unknown parameter `q`"

- name: join key types must match
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := input("b")
    b :: zset(record(name: sql.SqlString))
    ai := map_index(a, fun((r) -> (r.id, r)))
    bi := map_index(b, fun((r) -> (r.name, r)))
    j  := join(ai, bi, fun((k, x, y) -> k))

  expected_diagnostics:
    - pass: typecheck
      message: "`join` needs equal key types"

- name: an input needs a typespec
  source: |
    a := input("a")

  expected_diagnostics:
    - pass: typecheck
      message: "needs a `::` typespec"

- name: an input must be a record
  source: |
    a := input("a")
    a :: zset(i64)

  expected_diagnostics:
    - pass: typecheck
      message: "an input must be `zset(record(...))`"

- name: a cycle without delay is rejected
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(c, fun((r) -> r))
    c := map(b, fun((r) -> r))

  expected_diagnostics:
    - pass: typecheck
      message: "cycle"

- name: comparing incompatible types
  source: |
    a := input("a")
    a :: zset(record(id: i64, name: sql.SqlString))
    b := filter(a, fun((r) -> r.id == r.name))

  expected_diagnostics:
    - pass: typecheck
      message: "cannot compare"

- name: filter must return a bool
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := filter(a, fun((r) -> r.id))

  expected_diagnostics:
    - pass: typecheck
      message: "must return bool"

- name: a declared type that disagrees with inference
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, fun((r) -> r.id))
    b :: zset(sql.SqlString)

  expected_diagnostics:
    - pass: typecheck
      message: "is inferred as"

- name: unknown operator
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := frobnicate(a)

  expected_diagnostics:
    - pass: typecheck
      message: "unknown operator `frobnicate`"

- name: a tuple is only allowed as a map_index body
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, fun((r) -> (r.id, r.id)))

  expected_diagnostics:
    - pass: typecheck
      message: "only allowed as the body of a `map_index`"

- name: a stray character is a parse error
  source: |
    a := input("a")
    a ;; bad

  expected_diagnostics:
    - severity: error
      pass: parse
      message: "unexpected character ';'"
      line: 2
      column: 3

- name: an unterminated string is a parse error
  source: |
    a := input("a

  expected_diagnostics:
    - pass: parse
      message: "unterminated string literal"

- name: duplicate record fields are rejected at parse time
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, fun((r) -> record(x: r.id, x: r.id)))

  expected_diagnostics:
    - pass: parse
      message: "duplicate field `x`"

- name: optional(optional(T)) is rejected rather than flattened
  source: |
    a := input("a")
    a :: zset(record(x: optional(optional(i64))))

  expected_diagnostics:
    - pass: parse
      message: "not a distinct type"

- name: a flat_map body must be a list
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map(a, fun((r) -> r))

  expected_diagnostics:
    - pass: typecheck
      message: "must return a list of rows"

- name: an empty flat_map list has no inferable type
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map(a, fun((r) -> []))

  expected_diagnostics:
    - pass: typecheck
      message: "at least one element"

- name: flat_map rows must share one type
  source: |
    a := input("a")
    a :: zset(record(id: i64, name: sql.SqlString))
    b := flat_map(a, fun((r) -> [record(x: r.id), record(y: r.name)]))

  expected_diagnostics:
    - pass: typecheck
      message: "must share one type"

- name: every flat_map_index element must be a pair
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map_index(a, fun((r) -> [record(id: r.id)]))

  expected_diagnostics:
    - pass: typecheck
      message: "must be a `(key, value)` pair"

- name: a list is not a value
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, fun((r) -> [r.id]))

  expected_diagnostics:
    - pass: typecheck
      message: "a list is only allowed as the body of a `flat_map`"

- name: unknown aggregator
  source: |
    a := input("a")
    a :: zset(record(id: i64, k: i64))
    idx := map_index(a, fun((r) -> (r.k, r)))
    b := aggregate(idx, median, fun((v) -> v.id))

  expected_diagnostics:
    - pass: typecheck
      message: "expected min, max, sum, avg or count"

- name: sum needs a numeric projection
  source: |
    a := input("a")
    a :: zset(record(k: i64, name: sql.SqlString))
    idx := map_index(a, fun((r) -> (r.k, r)))
    b := aggregate(idx, sum, fun((v) -> v.name))

  expected_diagnostics:
    - pass: typecheck
      message: "needs a numeric projection"

- name: filter on an indexed stream needs two parameters
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: i64))
    idx := map_index(a, fun((r) -> (r.k, r)))
    b := filter(idx, fun((r) -> true))

  expected_diagnostics:
    - pass: typecheck
      message: "takes 1 parameter(s) but the operator supplies 2"

- name: a node may not be named after an operator
  source: |
    neg := input("neg")
    neg :: zset(record(v: i64))

  expected_diagnostics:
    - pass: parse
      message: "`neg` is a reserved word and cannot name a node"
      line: 1
      column: 1

- name: a node may not be named after an aggregator
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    min := map(a, fun((r) -> r))

  expected_diagnostics:
    - pass: parse
      message: "`min` is a reserved word"

- name: a node may not be named after a keyword
  source: |
    if := input("a")

  expected_diagnostics:
    - pass: parse
      message: "`if` is a reserved word"

- name: a parameter may not be named after a builtin
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    b := map(a, fun((abs) -> abs))

  expected_diagnostics:
    - pass: parse
      message: "`abs` is a reserved word and cannot name a parameter"

- name: null is reserved for the Variant value
  source: |
    a := input("a")
    a :: zset(record(v: optional(i64)))
    b := map(a, fun((r) -> record(v: null)))

  expected_diagnostics:
    - pass: parse
      message: "write `NONE` for a missing value"

- name: arithmetic needs a definite value, not an optional
  source: |
    a := input("a")
    a :: zset(record(x: optional(i64)))
    b := map(a, fun((r) -> record(v: r.x + 1)))

  expected_diagnostics:
    - pass: typecheck
      message: "may be none"

- name: not needs a definite value
  source: |
    a := input("a")
    a :: zset(record(p: optional(bool)))
    b := filter(a, fun((r) -> not r.p))

  expected_diagnostics:
    - pass: typecheck
      message: "`not` needs a value"

- name: conditionals are not implemented
  source: |
    a := input("a")
    a :: zset(record(x: i64))
    b := map(a, fun((r) -> if r.x then 1 else 2))

  expected_diagnostics:
    - pass: parse
      message: "reserved"

- name: sum over a float projection is rejected
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: f64))
    idx := map_index(a, fun((r) -> (r.k, r)))
    b := aggregate(idx, sum, fun((v) -> v.x))

  expected_diagnostics:
    - pass: typecheck
      message: "floating-point addition is not associative"

- name: avg over a float projection is rejected too
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: f64))
    idx := map_index(a, fun((r) -> (r.k, r)))
    b := aggregate(idx, avg, fun((v) -> v.x))

  expected_diagnostics:
    - pass: typecheck
      message: "cannot be applied to `f64`"

- name: input cannot be nested
  source: |
    out := map(input("emp"), fun((r) -> r))

  expected_diagnostics:
    - pass: typecheck
      message: "`input` cannot be nested"

- name: unknown circuit
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    c := nosuch(src: a)

  expected_diagnostics:
    - pass: typecheck
      message: "unknown circuit `nosuch`"

- name: a missing circuit argument
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit two(x: p, y: q) {
        out := plus(p, q)
    }
    c := two(x: a)

  expected_diagnostics:
    - pass: typecheck
      message: "missing argument `y`"

- name: an unknown circuit argument
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit one(x: p) {
        out := distinct(p)
    }
    c := one(x: a, z: a)

  expected_diagnostics:
    - pass: typecheck
      message: "has no parameter `z`"

- name: a duplicate circuit argument
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit one(x: p) {
        out := distinct(p)
    }
    c := one(x: a, x: a)

  expected_diagnostics:
    - pass: parse
      message: "duplicate argument `x`"

- name: referring to a node the circuit does not define
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit one(x: p) {
        out := distinct(p)
    }
    c   := one(x: a)
    bad := c.nope

  expected_diagnostics:
    - pass: typecheck
      message: "is not a node of `c`"

- name: circuits cannot nest
  source: |
    circuit outer(x: p) {
        circuit inner(y: q) {
            out := distinct(q)
        }
    }

  expected_diagnostics:
    - pass: parse
      message: "cannot be defined inside another"

- name: empty() where nothing determines its type
  source: |
    out := distinct(empty())

  expected_diagnostics:
    - pass: typecheck
      message: "`empty()` has no type here"

- name: empty() takes no arguments
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := plus(a, empty(a))

  expected_diagnostics:
    - pass: typecheck
      message: "`empty()` takes no arguments"

- name: fixpoint is not implemented yet
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit loop_(src: s) {
        out := distinct(s)
    }
    fp := fixpoint(loop_(src: a))

  expected_diagnostics:
    - pass: typecheck
      message: "`fixpoint` is not implemented yet"
