# Compilation failures. Only the fields a case writes are checked, so a fixture
# can pin a message without committing to a column, or pin a column once the
# span is known to be right.
#
# Each case names a `pass` and a `message` specific enough that a typo in the
# fixture's own source — which would also fail to compile — cannot satisfy it.

- name: unknown field
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := filter(a, function((r) -> r.nope > 1))

  expected_diagnostics:
    - severity: error
      pass: typecheck
      message: "has no field `nope`"
      line: 3
      column: 32

- name: unknown parameter
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := filter(a, function((r) -> q.id > 1))

  expected_diagnostics:
    - pass: typecheck
      message: "unknown parameter `q`"

- name: join key types must match
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := input("b")
    b :: zset(record(name: string))
    ai := map_index(a, function((r) -> record(key: r.id, value: r)))
    bi := map_index(b, function((r) -> record(key: r.name, value: r)))
    j  := join(ai, bi, function((k, x, y) -> k))

  expected_diagnostics:
    - pass: typecheck
      message: "`join` needs equal key types"

- name: an input needs a typespec
  source: |
    a := input("a")

  expected_diagnostics:
    - pass: typecheck
      message: "needs a `::` typespec"

- name: an input must be a record
  source: |
    a := input("a")
    a :: zset(i64)

  expected_diagnostics:
    - pass: typecheck
      message: "an input must be `zset(record(...))`"

- name: a cycle without delay is rejected
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(c, function((r) -> r))
    c := map(b, function((r) -> r))

  expected_diagnostics:
    - pass: typecheck
      message: "cycle"

- name: comparing incompatible types
  source: |
    a := input("a")
    a :: zset(record(id: i64, name: string))
    b := filter(a, function((r) -> r.id == r.name))

  expected_diagnostics:
    - pass: typecheck
      message: "cannot compare"

- name: filter must return a bool
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := filter(a, function((r) -> r.id))

  expected_diagnostics:
    - pass: typecheck
      message: "must return bool"

- name: a declared type that disagrees with inference
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, function((r) -> r.id))
    b :: zset(string)

  expected_diagnostics:
    - pass: typecheck
      message: "is inferred as"

- name: unknown operator
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := frobnicate(a)

  expected_diagnostics:
    - pass: typecheck
      message: "unknown operator `frobnicate`"

- name: a pair is not a value
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, function((r) -> (r.id, r.id)))

  # `(...)` groups an expression and nothing else. The three indexing operators
  # take an ordinary `record(key: ..., value: ...)`, so there is no pair form
  # left in the language to be legal anywhere.
  expected_diagnostics:
    - pass: parse
      message: "it does not build a pair"

- name: a stray character is a parse error
  source: |
    a := input("a")
    a ;; bad

  expected_diagnostics:
    - severity: error
      pass: parse
      message: "unexpected character ';'"
      line: 2
      column: 3

- name: an unterminated string is a parse error
  source: |
    a := input("a

  expected_diagnostics:
    - pass: parse
      message: "unterminated string literal"

- name: duplicate record fields are rejected at parse time
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := map(a, function((r) -> record(x: r.id, x: r.id)))

  expected_diagnostics:
    - pass: parse
      message: "duplicate field `x`"

- name: optional(optional(T)) is rejected rather than flattened
  source: |
    a := input("a")
    a :: zset(record(x: optional(optional(i64))))

  expected_diagnostics:
    - pass: parse
      message: "not a distinct type"

- name: a flat_map body must be an array
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map(a, function((r) -> r))

  expected_diagnostics:
    - pass: typecheck
      message: "must return an array of rows"

- name: an empty flat_map list has no inferable type
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map(a, function((r) -> []))

  expected_diagnostics:
    - pass: typecheck
      message: "at least one element"

- name: an array has one element type
  source: |
    a := input("a")
    a :: zset(record(id: i64, name: string))
    b := flat_map(a, function((r) -> [record(x: r.id), record(y: r.name)]))

  # An array is an ordinary value now, so this is the array's own rule rather
  # than one `flat_map` imposes on a list of output rows.
  expected_diagnostics:
    - pass: typecheck
      message: "incompatible types"

- name: flat_map_index elements must carry key and value
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map_index(a, function((r) -> [record(id: r.id)]))

  expected_diagnostics:
    - pass: typecheck
      message: "must return `record(key: ..., value: ...)`"

- name: an empty array has no element type
  source: |
    a := input("a")
    a :: zset(record(id: i64))
    b := flat_map(a, function((r) -> []))

  # Arrays are values now, so `[...]` is legal anywhere — but an empty one
  # names no element type, and nothing else in the expression supplies it.
  expected_diagnostics:
    - pass: typecheck
      message: "an empty array has no element type"

- name: unknown aggregator
  source: |
    a := input("a")
    a :: zset(record(id: i64, k: i64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    b := aggregate(idx, median, function((v) -> v.id))

  expected_diagnostics:
    - pass: typecheck
      message: "expected min, max, sum, avg or count"

- name: sum needs a numeric projection
  source: |
    a := input("a")
    a :: zset(record(k: i64, name: string))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    b := aggregate(idx, sum, function((v) -> v.name))

  expected_diagnostics:
    - pass: typecheck
      message: "needs a numeric projection"

- name: filter on an indexed stream needs two parameters
  source: |
    a := input("a")
    a :: zset(record(k: i64, v: i64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    b := filter(idx, function((r) -> true))

  expected_diagnostics:
    - pass: typecheck
      message: "takes 1 parameter(s) but the operator supplies 2"

- name: a node may not be named after an operator
  source: |
    neg := input("neg")
    neg :: zset(record(v: i64))

  expected_diagnostics:
    - pass: parse
      message: "`neg` is a reserved word and cannot name a node"
      line: 1
      column: 1

- name: a node may not be named after an aggregator
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    min := map(a, function((r) -> r))

  expected_diagnostics:
    - pass: parse
      message: "`min` is a reserved word"

- name: a node may not be named after a keyword
  source: |
    if := input("a")

  expected_diagnostics:
    - pass: parse
      message: "`if` is a reserved word"

- name: a parameter may not be named after a builtin
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    b := map(a, function((abs) -> abs))

  expected_diagnostics:
    - pass: parse
      message: "`abs` is a reserved word and cannot name a parameter"

- name: null is reserved for the Variant value
  source: |
    a := input("a")
    a :: zset(record(v: optional(i64)))
    b := map(a, function((r) -> record(v: null)))

  expected_diagnostics:
    - pass: parse
      message: "write `NONE` for a missing value"

- name: arithmetic needs a definite value, not an optional
  source: |
    a := input("a")
    a :: zset(record(x: optional(i64)))
    b := map(a, function((r) -> record(v: r.x + 1)))

  expected_diagnostics:
    - pass: typecheck
      message: "may be none"

- name: not needs a definite value
  source: |
    a := input("a")
    a :: zset(record(p: optional(bool)))
    b := filter(a, function((r) -> not r.p))

  expected_diagnostics:
    - pass: typecheck
      message: "`not` needs a value"

- name: conditionals are not implemented
  source: |
    a := input("a")
    a :: zset(record(x: i64))
    b := map(a, function((r) -> if r.x then 1 else 2))

  expected_diagnostics:
    - pass: parse
      message: "reserved"

- name: sum over a float projection is rejected
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: f64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    b := aggregate(idx, sum, function((v) -> v.x))

  expected_diagnostics:
    - pass: typecheck
      message: "floating-point addition is not associative"

- name: avg over a float projection is rejected too
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: f64))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    b := aggregate(idx, avg, function((v) -> v.x))

  expected_diagnostics:
    - pass: typecheck
      message: "cannot be applied to `f64`"

- name: input cannot be nested
  source: |
    out := map(input("emp"), function((r) -> r))

  expected_diagnostics:
    - pass: typecheck
      message: "`input` cannot be nested"

- name: unknown circuit
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    c := nosuch(src: a)

  expected_diagnostics:
    - pass: typecheck
      message: "unknown circuit `nosuch`"

- name: a missing circuit argument
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit two(x: p, y: q) {
        out := plus(p, q)
    }
    c := two(x: a)

  expected_diagnostics:
    - pass: typecheck
      message: "missing argument `y`"

- name: an unknown circuit argument
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit one(x: p) {
        out := distinct(p)
    }
    c := one(x: a, z: a)

  expected_diagnostics:
    - pass: typecheck
      message: "has no parameter `z`"

- name: a duplicate circuit argument
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit one(x: p) {
        out := distinct(p)
    }
    c := one(x: a, x: a)

  expected_diagnostics:
    - pass: parse
      message: "duplicate argument `x`"

- name: referring to a node the circuit does not define
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit one(x: p) {
        out := distinct(p)
    }
    c   := one(x: a)
    bad := c.nope

  expected_diagnostics:
    - pass: typecheck
      message: "is not a node of `c`"

- name: circuits cannot nest
  source: |
    circuit outer(x: p) {
        circuit inner(y: q) {
            out := distinct(q)
        }
    }

  expected_diagnostics:
    - pass: parse
      message: "cannot be defined inside another"

- name: empty() where nothing determines its type
  source: |
    out := distinct(empty())

  expected_diagnostics:
    - pass: typecheck
      message: "`empty()` has no type here"

- name: empty() takes no arguments
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := plus(a, empty(a))

  expected_diagnostics:
    - pass: typecheck
      message: "`empty()` takes no arguments"

- name: a fixpoint needs something to iterate
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit nothing(src: s) {
        out := distinct(s)
    }
    fp := fixpoint(nothing(src: a))

  # No body node shares a parameter label, so no parameter is recursive.
  expected_diagnostics:
    - pass: typecheck
      message: "has no recursive parameter"

- name: a recursive type that cannot be inferred needs a typespec
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit c(src: s, out: o) {
        out := map_index(o, function((r) -> record(key: r.v, value: r)))
    }
    fp := fixpoint(c(src: a, out: empty()))

  # `map_index`'s result type comes from its function, applied to a value whose
  # type is the one being solved for. Unlike `plus`, it equates nothing.
  expected_diagnostics:
    - pass: typecheck
      message: "cannot be inferred"

- name: a declared recursive type must match the inferred one
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit c(src: s, out: o) {
        out :: zset(record(w: i64))
        out := plus(s, o)
    }
    fp := fixpoint(c(src: a, out: empty()))

  expected_diagnostics:
    - pass: typecheck
      message: "is declared as"

- name: a recursive parameter must start empty
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit c(src: s, out: o) {
        out :: zset(record(v: i64))
        out := plus(s, o)
    }
    fp := fixpoint(c(src: a, out: a))

  expected_diagnostics:
    - pass: typecheck
      message: "so it starts empty: pass `empty()`"

- name: circuits cannot instantiate each other in a cycle
  source: |
    circuit a(src: s) {
        x := b(src: s)
    }
    circuit b(src: s) {
        y := a(src: s)
    }

  # Expansion is inlining, so this would not terminate. Without the check it is
  # a stack overflow rather than a diagnostic.
  expected_diagnostics:
    - pass: typecheck
      message: "instantiates itself through"

- name: a table cannot have two types
  source: |
    a := input("t")
    a :: zset(record(v: i64))
    b := input("t")
    b :: zset(record(w: string))

  expected_diagnostics:
    - pass: typecheck
      message: "declared with two different types"

# --- The type system does not lie -------------------------------------------
#
# Every operation whose result may be absent says so in its type, and every
# operation that cannot handle absence rejects it. See the "Absence" section of
# docs/design/language.md.

- name: length needs a string
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> length(r.v)))

  # `length` used to accept any argument and return a bare `i64`, so this
  # compiled and then evaluated to NONE in a column typed `i64`.
  expected_diagnostics:
    - pass: typecheck
      message: "argument 1 of `length` must be a string"

- name: concat rejects an optional operand
  source: |
    a := input("a")
    a :: zset(record(v: optional(string)))
    out := map(a, function((r) -> concat(r.v, r.v)))

  expected_diagnostics:
    - pass: typecheck
      message: "use `coalesce` to supply a default first"

- name: abs rejects an optional operand
  source: |
    a := input("a")
    a :: zset(record(v: optional(i64)))
    out := map(a, function((r) -> abs(r.v)))

  expected_diagnostics:
    - pass: typecheck
      message: "use `coalesce` to supply a default first"

- name: division yields an optional, so a definite typespec is rejected
  source: |
    a := input("a")
    a :: zset(record(v: i64, w: i64))
    out :: zset(record(q: i64))
    out := map(a, function((r) -> record(q: r.v / r.w)))

  # A zero divisor has no value to return, so `/` is the one arithmetic whose
  # result may be absent — and the type says so rather than the runtime
  # producing a NONE the schema forbids.
  expected_diagnostics:
    - pass: typecheck
      message: "is declared as `zset(record(q: i64))` but is inferred as `zset(record(q: optional(i64)))`"

- name: a fixpoint cannot be nested inside a fixpoint
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    circuit inner(base: ib, p: ip) {
        p :: zset(record(v: i64))
        p := plus(ib, ip)
    }
    circuit outer(base: ob, q: oq) {
        q :: zset(record(v: i64))
        f := fixpoint(inner(base: ob, p: empty()))
        q := plus(oq, f.p)
    }
    fp := fixpoint(outer(base: a, q: empty()))

  # `dbsp` allows circuits at arbitrary depth, but each level is a distinct Rust
  # circuit type needing its own instantiation of the lowering. This used to
  # compile and then fail inside `Runner::build` with a Debug dump of the plan,
  # from a branch whose own comment says the checker should have caught it.
  expected_diagnostics:
    - pass: typecheck
      message: "`fixpoint` cannot be nested"

# --- One way to write each thing --------------------------------------------

- name: the sql namespace has no types
  source: |
    a := input("a")
    a :: zset(record(v: sql.SqlString))

  # `sql.SqlString` and `string` were two ways to write one thing, with silent
  # coercion between them: every string builtin returned `sql.SqlString`
  # whatever it was given. The namespace stays reserved so it can come back with
  # types that are genuinely distinct.
  expected_diagnostics:
    - pass: parse
      message: "the `sql.*` namespace is reserved but has no types in this build"

- name: plus is arithmetic, not concatenation
  source: |
    a := input("a")
    a :: zset(record(v: string))
    out := map(a, function((r) -> r.v + r.v))

  # `+` used to double as string concatenation and return the *other* string
  # type. `concat` is the one way to join strings.
  expected_diagnostics:
    - pass: typecheck
      message: "cannot apply `+`"

# --- No implicit conversion --------------------------------------------------
#
# Arithmetic and comparison need operands of one type. A *literal* takes the
# type beside it, which is what lets one function body serve every numeric type;
# a *value* must already be the type you need.

- name: arithmetic will not mix two numeric types
  source: |
    a := input("a")
    a :: zset(record(i: i64, f: f64))
    out := map(a, function((r) -> record(v: r.i + r.f)))

  expected_diagnostics:
    - pass: typecheck
      message: "there is no implicit conversion"

- name: comparison will not mix two numeric types either
  source: |
    a := input("a")
    a :: zset(record(i: i64, f: f64))
    out := filter(a, function((r) -> r.i > r.f))

  # Comparison and arithmetic answer "can these two types meet?" the same way,
  # because both go through one `unify`.
  expected_diagnostics:
    - pass: typecheck
      message: "cannot compare them"

- name: a float literal has no integer type
  source: |
    a := input("a")
    a :: zset(record(i: i64))
    out := map(a, function((r) -> record(v: r.i + 1.5)))

  # An integer literal inhabits any numeric type; a float literal only the
  # floating ones. Neither drags the other operand anywhere.
  expected_diagnostics:
    - pass: typecheck
      message: "a float literal has no `i64` value"

# --- Functions --------------------------------------------------------------

- name: a function cannot call itself
  source: |
    function loop(x) { return loop(x) + 1 }

    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> loop(r.v)))

  # A function is inlined at check time, so this would not terminate while
  # *compiling*, never mind at runtime.
  expected_diagnostics:
    - pass: typecheck
      message: "calls itself through"

- name: mutual recursion is a cycle too
  source: |
    function ping(x) { return pong(x) }
    function pong(x) { return ping(x) }

    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> ping(r.v)))

  expected_diagnostics:
    - pass: typecheck
      message: "calls itself through"

- name: an error in a body names the call site that caused it
  source: |
    function scale(x) { return x * 2 }

    a := input("a")
    a :: zset(record(s: string))
    out := map(a, function((r) -> scale(r.s)))

  # The body is fine at every numeric type and wrong at this one, so pointing
  # only at the body would not say what to change. The span stays on the
  # offending expression; the message carries the call site.
  expected_diagnostics:
    - pass: typecheck
      message: "in `scale`, instantiated at"

- name: a name means one thing
  source: |
    function dup(x) { return x }

    dup := input("a")
    dup :: zset(record(v: i64))

  expected_diagnostics:
    - pass: typecheck
      message: "is both a function and a node"

- name: a function is called with the right number of arguments
  source: |
    function add(x, y) { return x + y }

    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> add(r.v)))

  expected_diagnostics:
    - pass: typecheck
      message: "`add` takes 2 argument(s), found 1"

# --- Branching and conversion -----------------------------------------------

- name: a fallible cast needs an optional target
  source: |
    a := input("a")
    a :: zset(record(x: f64))
    out := map(a, function((r) -> record(n: cast(r.x, i64))))

  # `cast(x, T)` yields exactly `T`. Where the conversion has inputs the target
  # cannot hold, that is an error naming the fix rather than a silently optional
  # result — the same rule division follows.
  expected_diagnostics:
    - pass: typecheck
      message: "can fail (NaN, infinity, or a value outside `i64`); write `cast(..., optional(i64))`"

- name: parsing a string is fallible too
  source: |
    a := input("a")
    a :: zset(record(s: string))
    out := map(a, function((r) -> record(n: cast(r.s, i64))))

  expected_diagnostics:
    - pass: typecheck
      message: "the text may not parse"

- name: an absent value needs an optional target
  source: |
    a := input("a")
    a :: zset(record(x: optional(i64)))
    out := map(a, function((r) -> record(n: cast(r.x, f64))))

  # An optional *target* is what admits an absent input, so absence needs no
  # propagation rule of its own: the written type says whether it is allowed.
  expected_diagnostics:
    - pass: typecheck
      message: "may be absent, so it cannot become `f64`"

- name: NONE needs an optional target
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> record(n: cast(NONE, i64))))

  expected_diagnostics:
    - pass: typecheck
      message: "`NONE` is not a `i64`; write `cast(NONE, optional(i64))`"

- name: some pairs of types have no conversion
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> record(b: cast(r.v, bool))))

  expected_diagnostics:
    - pass: typecheck
      message: "there is no conversion from `i64` to `bool`"

- name: if needs a bool condition
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> if(r.v, 1, 2)))

  expected_diagnostics:
    - pass: typecheck
      message: "`if` needs a bool condition, found `i64`"

- name: if's arms must agree on a type
  source: |
    a := input("a")
    a :: zset(record(i: i64, f: f64))
    out := map(a, function((r) -> if(r.i > 0, r.i, r.f)))

  # The arms meet under the same `unify` as arithmetic and comparison, so there
  # is one answer in the language to "can these two types come together".
  expected_diagnostics:
    - pass: typecheck
      message: "`if`'s two arms must agree"

# --- Documents ---------------------------------------------------------------

- name: optional(json) is not a type
  source: |
    a := input("a")
    a :: zset(record(payload: optional(json)))

  # A document carries its own null, so absence around one adds nothing — and on
  # the wire the two would be indistinguishable, since both write as `null`.
  expected_diagnostics:
    - pass: parse
      message: "a document is never absent"

- name: documents have no order
  source: |
    a := input("a")
    a :: zset(record(x: json, y: json))
    out := filter(a, function((r) -> r.x < r.y))

  # `cmp_values` compares the type tag first, so the order is well defined and
  # arbitrary — every number would precede every string.
  expected_diagnostics:
    - pass: typecheck
      message: "documents have no meaningful order"

- name: documents may still be compared for equality
  source: |
    a := input("a")
    a :: zset(record(x: json, y: json))
    out := filter(a, function((r) -> r.x == r.y))

  # Not an error: the encoding is canonical, so equality and hashing are sound
  # and a document works as a Z-set key. Pinned here beside the rejection so the
  # two rules stay visibly distinct.
  input:
    - a:
        - [1, {x: 1, y: 1}]
        - [1, {x: 1, y: 2}]

  expected_exact_output:
    - out:
        - [1, {x: 1, y: 1}]

- name: min over documents is rejected
  source: |
    a := input("a")
    a :: zset(record(k: i64, payload: json))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))
    out := aggregate(idx, min, function((v) -> v.payload))

  expected_diagnostics:
    - pass: typecheck
      message: "has no meaning over documents"

- name: extracting from a document needs an optional target
  source: |
    a := input("a")
    a :: zset(record(payload: json))
    out := map(a, function((r) -> cast(r.payload, i64)))

  # A document need not hold the shape asked of it, so every extraction is
  # fallible — the same rule `/` and string parsing already follow.
  expected_diagnostics:
    - pass: typecheck
      message: "write `cast(..., optional(i64))`"
