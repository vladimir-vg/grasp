# Operator calls nest. A named node now exists because it is worth naming, not
# because the grammar insists. `input` is the one exception: its schema comes
# from a `::` typespec, which needs a name to attach to.

- name: one declaration instead of two
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64))
    per_dept := weighted_count(map(emp, function((r) -> r.dept_id)))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10}]
        - [1, {id: 2, dept_id: 10}]
        - [1, {id: 3, dept_id: 20}]

  expected_exact_output:
    - per_dept:
        - [1, 10, 2]
        - [1, 20, 1]

- name: both sides of a join nested
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, name: String, dept_id: i64))
    dept := input("dept")
    dept :: zset(record(id: i64, dname: String))

    joined := join(
        map_index(emp,  function((r) -> record(key: r.dept_id, value: record(name: r.name)))),
        map_index(dept, function((r) -> record(key: r.id, value: record(dname: r.dname)))),
        function((k, e, d) -> record(name: e.name, dname: d.dname)))

  input:
    - emp:
        - [1, {id: 1, name: "ada", dept_id: 10}]
      dept:
        - [1, {id: 10, dname: "eng"}]

  expected_exact_output:
    - joined:
        - [1, {name: "ada", dname: "eng"}]

- name: nesting several levels deep
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := distinct(map(filter(a, function((r) -> r.v > 1)), function((r) -> record(w: r.v * 10))))

  input:
    - a:
        - [1, {v: 1}]
        - [1, {v: 2}]
        - [1, {v: 3}]

  expected_exact_output:
    - out:
        - [1, {w: 20}]
        - [1, {w: 30}]

- name: nested and named arguments mixed in one call
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    b := input("b")
    b :: zset(record(v: i64))
    small := filter(a, function((r) -> r.v < 10))
    both := plus(small, filter(b, function((r) -> r.v < 10)))

  input:
    - a:
        - [1, {v: 1}]
        - [1, {v: 99}]
      b:
        - [1, {v: 2}]

  expected_exact_output:
    - both:
        - [1, {v: 1}]
        - [1, {v: 2}]

- name: identical work is built once, and still adds twice
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    doubled := plus(filter(a, function((r) -> r.v > 0)), filter(a, function((r) -> r.v > 0)))

  input:
    - a:
        - [1, {v: 1}]

  # The two identical filters are one node, but `plus` still adds that stream
  # to itself, so the weight doubles either way. Deduplication changes which
  # nodes are built, never what comes out.
  expected_exact_output:
    - doubled:
        - [2, {v: 1}]

- name: an aggregator name is still not a nested call
  source: |
    a := input("a")
    a :: zset(record(k: i64, x: i64))
    hi := aggregate(map_index(a, function((r) -> record(key: r.k, value: r))), max, function((v) -> v.x))

  input:
    - a:
        - [1, {k: 1, x: 5}]
        - [1, {k: 1, x: 9}]

  expected_exact_output:
    - hi:
        - [1, 1, 9]
