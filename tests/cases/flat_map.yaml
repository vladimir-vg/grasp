# flat_map and flat_map_index. The list body is syntax, not a value: it says
# how many rows the operator emits per input row, and no list is ever streamed.

- name: one row fans out into two
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    tags := flat_map(emp, function((r) ->
        [record(id: r.id, tag: "primary"),
         record(id: r.id, tag: "backup")]))

  input:
    - emp:
        - [1, {id: 1}]

  expected_exact_output:
    - tags:
        - [1, {id: 1, tag: "primary"}]
        - [1, {id: 1, tag: "backup"}]

- name: a single-element list is just map
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    out := flat_map(emp, function((r) -> [record(id: r.id)]))

  input:
    - emp:
        - [1, {id: 1}]

  expected_exact_output:
    - out:
        - [1, {id: 1}]

- name: fan-out multiplies weights
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    two := flat_map(emp, function((r) -> [record(v: r.id), record(v: r.id + 100)]))

  input:
    - emp:
        - [2, {id: 1}]

  expected_exact_output:
    - two:
        - [2, {v: 1}]
        - [2, {v: 101}]

- name: identical rows in one list consolidate
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64))
    dup := flat_map(emp, function((r) -> [record(id: r.id), record(id: r.id)]))

  input:
    - emp:
        - [1, {id: 1}]

  # Both elements produce the same row, so the weights add.
  expected_exact_output:
    - dup:
        - [2, {id: 1}]

- name: flat_map_index emits several keys per row
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, mgr_id: i64))
    both := flat_map_index(emp, function((r) ->
        [record(key: r.dept_id, value: record(id: r.id)),
         record(key: r.mgr_id, value: record(id: r.id))]))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, mgr_id: 20}]

  expected_exact_output:
    - both:
        - [1, 10, {id: 1}]
        - [1, 20, {id: 1}]

- name: a flat_map_index result joins like any other indexed stream
  source: |
    emp := input("emp")
    emp :: zset(record(id: i64, dept_id: i64, mgr_id: i64))
    dept := input("dept")
    dept :: zset(record(id: i64, dname: String))
    ei := flat_map_index(emp, function((r) ->
        [record(key: r.dept_id, value: record(id: r.id)), record(key: r.mgr_id, value: record(id: r.id))]))
    di := map_index(dept, function((r) -> record(key: r.id, value: record(dname: r.dname))))
    j  := join(ei, di, function((k, e, d) -> record(id: e.id, dname: d.dname)))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, mgr_id: 20}]
      dept:
        - [1, {id: 10, dname: "eng"}]
        - [1, {id: 20, dname: "ops"}]

  expected_exact_output:
    - j:
        - [1, {id: 1, dname: "eng"}]
        - [1, {id: 1, dname: "ops"}]

# --- Arrays are values ------------------------------------------------------

- name: fan-out follows the data, not the source
  source: |
    posts := input("posts")
    posts :: zset(record(id: i64, tags: array(String)))
    tags := flat_map(posts, function((r) -> r.tags))

  # The array comes out of the row, so one input row emits as many rows as it
  # happens to carry — none, one, or three. With `[...]` as fan-out *syntax*
  # the count was fixed by the program text and this was not expressible at
  # all; it is what a SQL frontend needs for `UNNEST`.
  input:
    - posts:
        - [1, {id: 1, tags: ["a", "b", "c"]}]
        - [1, {id: 2, tags: ["b"]}]
        - [1, {id: 3, tags: []}]

  expected_exact_output:
    - tags:
        - [2, "b"]
        - [1, "a"]
        - [1, "c"]

- name: an array survives a round trip, and length measures it
  source: |
    posts := input("posts")
    posts :: zset(record(id: i64, tags: array(String)))
    out := map(posts, function((r) -> record(tags: r.tags, n: length(r.tags))))

  input:
    - posts:
        - [1, {id: 1, tags: ["a", "b"]}]

  expected_exact_output:
    - out:
        - [1, {tags: ["a", "b"], n: 2}]

- name: the whole mapping family takes either stream shape
  source: |
    a := input("a")
    a :: zset(record(k: i64, tags: array(String)))
    idx := map_index(a, function((r) -> record(key: r.k, value: r)))

    flattened := map(idx, function((k, v) -> record(k: k, n: length(v.tags))))
    rekeyed   := map_index(idx, function((k, v) -> record(key: length(v.tags), value: v)))
    exploded  := flat_map(idx, function((k, v) -> v.tags))

  # `filter` always took either shape, feeding one row for a flat stream and
  # `(key, value)` for an indexed one. The rest of the family now follows the
  # same rule, and the *result* shape comes from what the function returns
  # rather than from what it was given — which is why `map` over an indexed
  # stream flattens it.
  input:
    - a:
        - [1, {k: 7, tags: ["x", "y"]}]

  expected_exact_output:
    - flattened:
        - [1, {k: 7, n: 2}]
      rekeyed:
        - [1, 2, {k: 7, tags: ["x", "y"]}]
      exploded:
        - [1, "x"]
        - [1, "y"]
