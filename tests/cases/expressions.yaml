# The expression language: precedence, absence, and the builtins.

- name: arithmetic respects precedence
  source: |
    a := input("a")
    a :: zset(record(x: i64, y: i64))
    out := map(a, function((r) -> record(v: r.x + r.y * 2)))

  input:
    - a:
        - [1, {x: 1, y: 10}]

  expected_exact_output:
    - out:
        - [1, {v: 21}]

- name: parentheses override precedence
  source: |
    a := input("a")
    a :: zset(record(x: i64, y: i64))
    out := map(a, function((r) -> record(v: (r.x + r.y) * 2)))

  input:
    - a:
        - [1, {x: 1, y: 10}]

  expected_exact_output:
    - out:
        - [1, {v: 22}]

- name: an none value compares as less than every value
  source: |
    a := input("a")
    a :: zset(record(id: i64, x: optional(i64)))
    kept := filter(a, function((r) -> r.x > 5))

  input:
    - a:
        - [1, {id: 1, x: 10}]
        - [1, {id: 2, x: null}]

  # Not propagation: `NONE > 5` is a definite `false`, because NONE sorts
  # before every value. The comparison yields a plain bool either way.
  expected_exact_output:
    - kept:
        - [1, {id: 1, x: 10}]

- name: NONE is compared like any other value
  source: |
    a := input("a")
    a :: zset(record(id: i64, x: optional(i64)))
    out := map(a, function((r) -> record(missing: r.x == NONE, v: coalesce(r.x, 0))))

  input:
    - a:
        - [1, {id: 1, x: 10}]
        - [1, {id: 2, x: null}]

  expected_exact_output:
    - out:
        - [1, {missing: false, v: 10}]
        - [1, {missing: true, v: 0}]

- name: two none values are equal
  source: |
    a := input("a")
    a :: zset(record(id: i64, x: optional(i64), y: optional(i64)))
    out := map(a, function((r) -> record(id: r.id, same: r.x == r.y)))

  input:
    - a:
        - [1, {id: 1, x: null, y: null}]
        - [1, {id: 2, x: 5, y: null}]
        - [1, {id: 3, x: 5, y: 5}]

  # This is the sharpest departure from SQL, where NULL = NULL is unknown.
  expected_exact_output:
    - out:
        - [1, {id: 1, same: true}]
        - [1, {id: 2, same: false}]
        - [1, {id: 3, same: true}]

- name: string and numeric builtins
  source: |
    a := input("a")
    a :: zset(record(name: string, n: i64))
    out := map(a, function((r) -> record(
        shout: upper(r.name),
        size: length(r.name),
        mag: abs(r.n))))

  input:
    - a:
        - [1, {name: "ada", n: -7}]

  expected_exact_output:
    - out:
        - [1, {shout: "ADA", size: 3, mag: 7}]

- name: not and or
  source: |
    a := input("a")
    a :: zset(record(id: i64, p: bool, q: bool))
    out := filter(a, function((r) -> not r.p or r.q))

  input:
    - a:
        - [1, {id: 1, p: true, q: false}]
        - [1, {id: 2, p: false, q: false}]
        - [1, {id: 3, p: true, q: true}]

  expected_exact_output:
    - out:
        - [1, {id: 2, p: false, q: false}]
        - [1, {id: 3, p: true, q: true}]

# --- Totality ----------------------------------------------------------------
#
# Arithmetic is total: integer overflow wraps and float arithmetic is IEEE, so
# no result is ever absent in a column whose type forbids it. Division is the
# single exception, and its result type says so.

- name: a zero divisor yields NONE, which the result type allows
  source: |
    a := input("a")
    a :: zset(record(v: i64, w: i64))
    out := map(a, function((r) -> record(q: r.v / r.w, m: r.v % r.w)))

  input:
    - a:
        - [1, {v: 7, w: 2}]
        - [1, {v: 7, w: 0}]

  expected_exact_output:
    - out:
        - [1, {q: 3, m: 1}]
        - [1, {q: null, m: null}]

- name: integer overflow wraps rather than becoming absent
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> record(sq: r.v * r.v, neg: -r.v, ab: abs(r.v))))

  # Wrapping keeps the result a definite `i64`, which is what lets the type stay
  # non-optional. The alternative — NONE on overflow — would put absence in a
  # column typed `i64`.
  input:
    - a:
        - [1, {v: 4000000000}]

  expected_exact_output:
    - out:
        - [1, {sq: -2446744073709551616, neg: -4000000000, ab: 4000000000}]

- name: one body, two numeric types
  source: |
    a := input("a")
    a :: zset(record(i: i64, f: f64))
    ints   := map(a, function((r) -> r.i * 2))
    floats := map(a, function((r) -> r.f * 2))

  # The literal `2` takes the type of the operand beside it, so the same body
  # is `i64` in one node and `f64` in the other. That is what makes a shared
  # numeric helper possible without a promotion lattice.
  input:
    - a:
        - [1, {i: 3, f: 1.5}]

  expected_exact_output:
    - ints:
        - [1, 6]
      floats:
        - [1, 3.0]

# --- Functions are macros ----------------------------------------------------

- name: one named function serves two numeric types
  source: |
    function scale(x) { return x * 2 + 1 }

    a := input("a")
    a :: zset(record(i: i64, f: f64))
    ints   := map(a, function((r) -> scale(r.i)))
    floats := map(a, function((r) -> scale(r.f)))

  # A function is a template: its parameter carries no type, so the body is
  # checked afresh at each call site and the literals inside it take the type of
  # whatever they are used with. `scale` is `i64` arithmetic in one node and
  # `f64` arithmetic in the other, from one definition.
  input:
    - a:
        - [1, {i: 3, f: 1.5}]

  expected_exact_output:
    - ints:
        - [1, 7]
      floats:
        - [1, 4.0]

- name: a named function is an operator argument
  source: |
    function positive(r) { return r.v > 0 }

    a := input("a")
    a :: zset(record(v: i64))
    kept := filter(a, positive)

  # Passing the function by name is what lets one definition be reused across
  # operators rather than retyped at each.
  input:
    - a:
        - [1, {v: 5}]
        - [1, {v: -5}]

  expected_exact_output:
    - kept:
        - [1, {v: 5}]

- name: functions compose
  source: |
    function double(x)   { return x * 2 }
    function quadruple(x) { return double(double(x)) }

    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> quadruple(r.v)))

  input:
    - a:
        - [1, {v: 3}]

  expected_exact_output:
    - out:
        - [1, 12]

- name: the numeric builtins are type-preserving
  source: |
    a := input("a")
    a :: zset(record(x: f64, n: i64))
    out := map(a, function((r) -> record(
        fl: floor(r.x), ce: ceil(r.x), ro: round(r.x),
        ab: abs(r.x), ni: abs(r.n))))

  # `floor`/`ceil`/`round` return the type they were given rather than
  # converting: there is no conversion between two known types in the language,
  # so nothing here turns an f64 into an i64.
  input:
    - a:
        - [1, {x: -2.5, n: -7}]

  expected_exact_output:
    - out:
        - [1, {fl: -3.0, ce: -2.0, ro: -3.0, ab: 2.5, ni: 7}]

- name: the string builtins
  source: |
    a := input("a")
    a :: zset(record(s: string))
    out := map(a, function((r) -> record(
        lo: lower(r.s), up: upper(r.s), tr: trim(r.s),
        both: concat(trim(r.s), "!"), n: length(r.s))))

  input:
    - a:
        - [1, {s: "  MiXeD  "}]

  expected_exact_output:
    - out:
        - [1, {lo: "  mixed  ", up: "  MIXED  ", tr: "MiXeD", both: "MiXeD!", n: 9}]

# --- Branching and conversion -----------------------------------------------

- name: if branches on a bool
  source: |
    a := input("a")
    a :: zset(record(v: i64))
    out := map(a, function((r) -> record(
        sign: if(r.v > 0, "positive", if(r.v < 0, "negative", "zero")))))

  # Nested `if` is how a SQL `CASE` lowers. `if` is evaluated lazily, but every
  # expression in this language is total, so that is a cost property and never
  # a semantic one — an untaken branch could not have produced an error to
  # avoid.
  input:
    - a:
        - [1, {v: 7}]
        - [1, {v: -7}]
        - [1, {v: 0}]

  expected_exact_output:
    - out:
        - [1, {sign: "positive"}]
        - [1, {sign: "negative"}]
        - [1, {sign: "zero"}]

- name: SQL null propagation, at two numeric types
  source: |
    function add_null(a, b) {
        return if(a == NONE or b == NONE, NONE, coalesce(a, 0) + coalesce(b, 0))
    }

    a := input("a")
    a :: zset(record(i: optional(i64), j: optional(i64), x: optional(f64), y: optional(f64)))
    out := map(a, function((r) -> record(ints: add_null(r.i, r.j), floats: add_null(r.x, r.y))))

  # SQL's `a + b` is NULL when either side is; this language's arithmetic
  # rejects an optional operand instead, because propagating silently is what
  # `NONE` exists to avoid. The propagation a frontend needs is therefore
  # written out — once, in a function that serves every numeric type, since
  # `0` takes the type of whatever it is coalesced against.
  input:
    - a:
        - [1, {i: 2, j: 3, x: 1.5, y: 2.5}]
        - [1, {i: 2, j: null, x: 1.5, y: null}]

  expected_exact_output:
    - out:
        - [1, {ints: 5, floats: 4.0}]
        - [1, {ints: null, floats: null}]

- name: cast converts between known types
  source: |
    a := input("a")
    a :: zset(record(n: i64, x: f64, s: string, b: bool))
    out := map(a, function((r) -> record(
        widened:  cast(r.n, f64) * 1.5,
        narrowed: cast(r.x, optional(i64)),
        text:     cast(r.n, string),
        parsed:   cast(r.s, optional(i64)),
        shown:    cast(r.b, string))))

  # Deleting implicit promotion left no path from i64 to f64; `cast` is that
  # path, and it is explicit at the point of use rather than a lattice an
  # emitter has to model. `narrowed` and `parsed` need an optional target
  # because those conversions have inputs the target cannot hold.
  input:
    - a:
        - [1, {n: 4, x: 2.9, s: "17", b: true}]
        - [1, {n: 4, x: 2.9, s: "nope", b: true}]

  expected_exact_output:
    - out:
        - [1, {widened: 6.0, narrowed: 2, text: "4", parsed: 17, shown: "true"}]
        - [1, {widened: 6.0, narrowed: 2, text: "4", parsed: null, shown: "true"}]
