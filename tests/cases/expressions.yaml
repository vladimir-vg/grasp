# The expression language: precedence, absence, and the builtins.

- name: arithmetic respects precedence
  source: |
    a := input("a")
    a :: zset(record(x: i64, y: i64))
    out := map(a, fun((r) -> record(v: r.x + r.y * 2)))

  input:
    - a:
        - [1, {x: 1, y: 10}]

  expected_exact_output:
    - out:
        - [1, {v: 21}]

- name: parentheses override precedence
  source: |
    a := input("a")
    a :: zset(record(x: i64, y: i64))
    out := map(a, fun((r) -> record(v: (r.x + r.y) * 2)))

  input:
    - a:
        - [1, {x: 1, y: 10}]

  expected_exact_output:
    - out:
        - [1, {v: 22}]

- name: an absent value compares as less than every value
  source: |
    a := input("a")
    a :: zset(record(id: i64, x: optional(i64)))
    kept := filter(a, fun((r) -> r.x > 5))

  input:
    - a:
        - [1, {id: 1, x: 10}]
        - [1, {id: 2, x: null}]

  # Not propagation: `ABSENT > 5` is a definite `false`, because ABSENT sorts
  # before every value. The comparison yields a plain bool either way.
  expected_exact_output:
    - kept:
        - [1, {id: 1, x: 10}]

- name: ABSENT is compared like any other value
  source: |
    a := input("a")
    a :: zset(record(id: i64, x: optional(i64)))
    out := map(a, fun((r) -> record(missing: r.x == ABSENT, v: coalesce(r.x, 0))))

  input:
    - a:
        - [1, {id: 1, x: 10}]
        - [1, {id: 2, x: null}]

  expected_exact_output:
    - out:
        - [1, {missing: false, v: 10}]
        - [1, {missing: true, v: 0}]

- name: two absent values are equal
  source: |
    a := input("a")
    a :: zset(record(id: i64, x: optional(i64), y: optional(i64)))
    out := map(a, fun((r) -> record(id: r.id, same: r.x == r.y)))

  input:
    - a:
        - [1, {id: 1, x: null, y: null}]
        - [1, {id: 2, x: 5, y: null}]
        - [1, {id: 3, x: 5, y: 5}]

  # This is the sharpest departure from SQL, where NULL = NULL is unknown.
  expected_exact_output:
    - out:
        - [1, {id: 1, same: true}]
        - [1, {id: 2, same: false}]
        - [1, {id: 3, same: true}]

- name: string and numeric builtins
  source: |
    a := input("a")
    a :: zset(record(name: sql.SqlString, n: i64))
    out := map(a, fun((r) -> record(
        shout: upper(r.name),
        size: length(r.name),
        mag: abs(r.n))))

  input:
    - a:
        - [1, {name: "ada", n: -7}]

  expected_exact_output:
    - out:
        - [1, {shout: "ADA", size: 3, mag: 7}]

- name: not and or
  source: |
    a := input("a")
    a :: zset(record(id: i64, p: bool, q: bool))
    out := filter(a, fun((r) -> not r.p or r.q))

  input:
    - a:
        - [1, {id: 1, p: true, q: false}]
        - [1, {id: 2, p: false, q: false}]
        - [1, {id: 3, p: true, q: true}]

  expected_exact_output:
    - out:
        - [1, {id: 2, p: false, q: false}]
        - [1, {id: 3, p: true, q: true}]
