# filter and map, the operators that carry real expressions.

- name: filter on a comparison
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, salary: i64))
    rich := filter(emp, fun((r) -> r.salary > 100))

  input:
    - emp:
        - [1, {id: 1, salary: 150}]
        - [1, {id: 2, salary: 90}]

  expected_exact_output:
    - rich:
        - [1, {id: 1, salary: 150}]

- name: filter on a conjunction
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, salary: i64, active: bool))
    hits := filter(emp, fun((r) -> r.salary > 100 and r.active))

  input:
    - emp:
        - [1, {id: 1, salary: 150, active: true}]
        - [1, {id: 2, salary: 150, active: false}]
        - [1, {id: 3, salary: 50, active: true}]

  expected_exact_output:
    - hits:
        - [1, {id: 1, salary: 150, active: true}]

- name: map projects a record
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, name: sql.SqlString, salary: i64))
    small := map(emp, fun((r) -> record(id: r.id, name: r.name)))

  input:
    - emp:
        - [1, {id: 1, name: "ada", salary: 150}]

  expected_exact_output:
    - small:
        - [1, {id: 1, name: "ada"}]

- name: map to a bare scalar
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, dept_id: i64))
    depts := map(emp, fun((r) -> r.dept_id))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10}]
        - [1, {id: 2, dept_id: 20}]

  expected_exact_output:
    - depts:
        - [1, 10]
        - [1, 20]

- name: filter on an indexed stream sees the key and the value
  source: |
    emp := input("emp")
    emp :: OrdZSet(record(id: i64, dept_id: i64, salary: i64))
    idx := map_index(emp, fun((r) -> (r.dept_id, record(id: r.id, salary: r.salary))))
    # Two parameters here, because an indexed stream's element is the pair.
    picked := filter(idx, fun((k, v) -> k == 10 and v.salary > 100))

  input:
    - emp:
        - [1, {id: 1, dept_id: 10, salary: 150}]
        - [1, {id: 2, dept_id: 10, salary: 50}]
        - [1, {id: 3, dept_id: 20, salary: 150}]

  expected_exact_output:
    - picked:
        - [1, 10, {id: 1, salary: 150}]
